classname=net.ildar.wurm.WurmHelper
classpath=WurmHelper.jar
sharedClassLoader=true

# Hide the periodic "Ildar blesses you!" message
#NoBlessings=false

# Colour of the mod's console messages, as r,g,b between 0 and 1
#ConsoleMsgColor=0.5,1.0,1.0

# Also show bot state changes (on/off, paused, toggles) on screen, not only in the console
#OnscreenFeedback=true

# Play an alarm sound when a bot stops by itself (an error, a missing tool...)
#AlarmOnStop=false

# Put the last bot command back into the console input line after running it.
# Turn off if you drive bots from keybinds and don't want the input line rewritten
#PrefillConsoleInput=true


# Checks for a new SkloGraphics release at game start and installs it automatically (signed and verified, restarts the game once). Set to false to stay on your current version.
autoUpdate=false

# Overall graphics quality: Low, Medium, High or Ultra.
# Ultra: everything at full quality, including the game's own graphics settings at their maximum (see the game* settings below).
# High: Ultra without the moving volumetric clouds (flat sky clouds instead) - those clouds alone cost about a quarter of the frame.
# Medium: High without the volumetric light shafts, depth of field and tree reflections in water; lighter ambient occlusion,
#   smaller shadow maps, a 1024 water reflection, shorter tree, grass and decoration distances, fewer parallax and
#   reflection steps, smaller lamp shadows and a shorter forest-shadow range.
# Low: Medium without ambient occlusion, stylized grass, parallax relief, reflections, lamp shadows, forest shadows, god rays,
#   lens flare, film grain, colour fringing and lens dirt; the smallest shadows and distances.
# High, Medium and Low also lower the game's own graphics settings step by step (see the game* settings below).
# Any setting below that you uncomment overrides the preset.
qualityPreset=High

# The game's own graphics settings. SkloGraphics sets these at every start from qualityPreset and removes them from
# the game's settings menu. Numbers pick an entry of the game's own list, counted from 0 (e.g. Low=0, Medium=1, High=2).
# The values shown are Ultra's; "Low/Medium/High/Ultra:" lists what each preset uses. Uncomment one to override the preset,
# or set it to game to hand that setting back to the game's settings menu.
# Renderer: 0 Legacy, 1 Modern. SkloGraphics needs Modern.
#gameRenderer=1
# Terrain detail: 0 Low, 1 Medium, 2 High. Low/Medium/High/Ultra: 1/2/2/2.
#gameTerrainDetail=2
# Tile detail: 0 Very Sparse, 1 Sparse, 2 Medium, 3 Dense, 4 Extreme. Low/Medium/High/Ultra: 1/2/3/4.
#gameTileDetail=4
# Sky detail: 0 Low, 1 Medium, 2 High. Low/Medium/High/Ultra: 1/2/2/2.
#gameSkyDetail=2
# Cave detail: 0 Low, 1 Medium, 2 High. Low/Medium/High/Ultra: 1/2/2/2.
#gameCaveDetail=2
# Shadow detail: 0 Disabled, 1 Simple Objects, 2 Objects, 3 Objects & Structures, 4 Everything. 3 and up lets buildings cast shadows, 4 also trees. Low/Medium/High/Ultra: 2/3/4/4.
#gameShadowDetail=4
# Shadow map size: 0 Small, 1 Medium, 2 Large, 3 Huge. Low/Medium/High/Ultra: 1/2/3/3.
#gameShadowMapSize=3
# Water detail: 0 Low, 1 Medium, 2 High.
#gameWaterDetail=2
# Water reflections: 0 Disabled, 1 Sky, 2 Sky & Terrain, 3 Sky, Terrain & Trees, 4 Almost Everything. Low/Medium/High/Ultra: 2/3/4/4 (only matters when waterReflectEverything=false, which Low and Medium use).
#gameWaterReflections=4
# Distant terrain: true renders the far-away low-detail terrain.
#gameDistantTerrain=true
# Tree, item & creature and structure render distance: 0 Very Short, 1 Short, 2 Medium, 3 Far, 4 Extreme. Low/Medium/High/Ultra: 2/3/4/4.
#gameTreeDistance=4
#gameItemCreatureDistance=4
#gameStructureDistance=4
# Animation quality: 0 None, 1 Low, 2 Medium, 3 High, 4 Extreme. Low/Medium/High/Ultra: 2/3/4/4.
#gameAnimationQuality=4
# Player animations: 0 All, 1 Walking Only, 2 None.
#gamePlayerAnimations=0
# The game's own sun glare. SkloGraphics draws its own sun effects, so this stays off.
#gameSunGlare=false
# Texture quality: 0 Low, 1 Medium, 2 High, 3 Very High. Low/Medium/High/Ultra: 2/3/3/3.
#gameTextureQuality=3
# Player texture size: 0 256, 1 512, 2 1024, 3 2048. Low/Medium/High/Ultra: 1/2/3/3.
#gamePlayerTextureSize=3
# Normal mapping (surface depth on textures).
#gameNormalMapping=true
# Reflection detail: 0 Low, 1 Medium, 2 High. Low/Medium/High/Ultra: 0/1/2/2.
#gameReflectionDetail=2
# Terrain/shadow detail: 0 Low, 1 Medium, 2 High, 3 Very High. Low/Medium/High/Ultra: 1/2/3/3.
#gameTerrainShadowDetail=3
# Detailed weather, ambient environment (birds, butterflies, fish, falling leaves), particles & effects, pretty 3D trees.
#gameDetailedWeather=true
#gameAmbientEnvironment=true
#gameParticles=true
gamePrettyTrees=true
# Anisotropic filtering: 0 1x, 1 2x, 2 4x, 3 8x, 4 16x. Low/Medium/High/Ultra: 2/3/4/4.
#gameAnisotropicFiltering=4
# Antialiasing (MSAA): 0 off, 1 2x, 2 4x, 3 8x, 4 16x. Low/Medium/High/Ultra: 0/1/2/3. Falls back to a lower level automatically if the graphics card can't do it.
#gameAntialiasing=4
# Level of detail for models, and the distance it starts at: 0 Short, 1 Normal, 2 Far. Distance Low/Medium/High/Ultra: 0/1/2/2.
#gameLod=true
#gameLodDistance=2
# Dynamic light limit and the maximum number of dynamic lights (1-16). Maximum Low/Medium/High/Ultra: 6/8/12/16.
#gameLimitDynamicLights=true
#gameMaxDynamicLights=16
# Contribution culling hides models that are very small on screen. Off keeps every model visible. On only on Low.
#gameContributionCulling=false
#gameContributionCullingDistance=200
# Detailed spyglass: high resolution while looking through a spyglass.
#gameDetailedSpyglass=true
# Resolution scale (supersampling): 0 100%, 1 125%, 2 150%, 3 175%, 4 200%. Above 100% is very slow.
#gameResolutionScale=0
# The game's own post-process effects. SkloGraphics replaces them with its own (see usePostProcess); the game's FXAA is only used when usePostProcess=false.
#gameFXAA=true
#gameBloom=false
#gameVignette=false
# Creature and player animation runs on the graphics card (the CPU path is slower and less tested with SkloGraphics).
#gameGpuSkinning=true
# Lets the game compress textures on upload: less video memory, blurrier textures.
gameCompressedTextures=true
# Largest texture the game may create: 0 256, 1 512, 2 1024, 3 2048, 4 4096, 5 8192, 6 No Limit. Lowered automatically to what the graphics card can do.
#gameMegaTextureSize=6
# Number of lights the game's forward shaders handle per object (2-8). Lowered automatically on graphics cards that can't do 8.
#gameShaderLights=8
# Sets every OpenGL compatibility option (GLSL, VBO, FBO, multidraw, non-power-of-two textures, automatic mipmaps, occlusion
# queries, depth clamping) to its modern (core) version and removes them from the Compatibility settings page. Each one falls
# back automatically on graphics cards without it. SkloGraphics needs OpenGL 3.3; without it the game stops at start with a
# message naming your graphics card instead of crashing later.
#gameCoreOpenGL=true
# Switches off the game's developer debug options (no world render, no terrain render, debug counters, per-frame OpenGL
# error logging, keeping every model in memory) in case one was left on, and writes the exact error of any shader that fails
# to compile into client.log, so graphics-card problems can be found from a player's log.
#gameResetDebugOptions=true

# Writes every vanilla shader's raw GLSL source to mods/shaderDumps/ the first time it compiles, a one-time capture rather than an ongoing effect.
#useShaderDump=false

# Ambient occlusion: ground-truth based (GTAO, the technique used by modern engines). Physically weighted horizon search
# per pixel, edge-aware denoising, applied mainly to ambient (sky) light so it never paints black lines into sunlit areas.
useSSAO=false
# Reach of the occlusion in metres. Larger = broader soft shadowing in corners and under objects.
#ssaoRadius=1.5
# Ignores the faintest occlusion (0..0.5) so near-flat creases such as tile borders stay completely clean.
#ssaoBias=0.02
# Strength as an exponent on the physical result: 1 = physically correct, higher = darker, lower = lighter.
# Live-tunable in game with the console command: ssao [radius n] [intensity n] [bias n] [direct n] [slices n] [steps n]
#ssaoIntensity=1.5
# Number of horizon slices per pixel (1-8). More = smoother, costs GPU time.
ssaoDirections=2
# Samples per horizon direction (1-16). More = catches thin objects better, costs GPU time.
ssaoSteps=6
# Distance in metres where ambient occlusion starts fading out, and where it is gone completely.
#ssaoFadeStart=120
#ssaoFadeEnd=220
# How much ambient occlusion also darkens surfaces lit directly by the sun (0..1). 0 = only shadowed/ambient light is
# occluded (subtle), 1 = full strength everywhere like classic SSAO. Grass, lawns and tree bases are mostly sunlit, so keep this high to see them.
#ssaoDirectLight=0.75
# Whether trees (3D and billboard) receive ambient occlusion. Bushes and young trees never do. On, trees keep only the broad shading (deep inside crowns, under branches): narrow dark lines along leaf edges, which thin alpha-tested leaves always produce in SSAO, are filtered out. Off leaves trees without SSAO.
#ssaoOnTrees=true
# Removes the dark outlines and speckled rims around tree leaves: fixes broken (NaN) leaf normals that lit edge pixels black, and rebuilds the leaf textures' edges and mipmaps at load time so the black transparent padding no longer darkens leaf edges at a distance. Only affects trees. Needs a client restart; billboard trees rebake once.
#treeEdgeFix=true
# Faster loading after login and teleport: the terrain right around you is finished every frame, the distant terrain
# rings are baked in the background over the next frames instead of freezing the game until everything is done.
# A loading bar shows while that takes longer than a moment.
#useTerrainBakeBudget=true
# Milliseconds per frame the game may wait for distant terrain to finish (lower = smoother, distance fills in slower).
#terrainBakeBudgetMs=4.0
# How many terrain rings around you always finish immediately (1 = only the closest, higher = more detail at once).
#terrainNearLods=2
# Diagnostics: writes loading timings and, for every frame slower than 250 ms in the 40 s after login or a teleport,
# where the game was busy into client.log. Those stack samples are not errors. Leave off unless asked for a trace.
#debugLoadTrace=false

# Master switch for the whole custom post-process chain - anti-aliasing, bloom, color grading, vignette, sharpening.
#usePostProcess=true
# Enables fast approximate anti-aliasing on the final frame.
#useFXAA=true
# Enables a soft glow bleeding out from the brightest areas of the scene.
useBloom=true
# Brightness a pixel must exceed before it starts contributing to bloom.
#bloomThreshold=0.65
# Softness of the transition around the bloom threshold, instead of a hard cutoff.
#bloomKnee=0.3
# Strength of the bloom glow added back into the final image.
bloomIntensity=0.07
# Enables darkening toward the edges of the screen.
#useVignette=true
# How dark the vignette gets at the screen's corners.
#vignetteStrength=0.1
# How far in from the edge the vignette darkening starts.
#vignetteSoftness=0.5
# Enables the saturation/contrast/gamma grading pass.
#useColorGrade=true
# Multiplier on overall color intensity - above 1 is more vivid, below 1 more washed out.
colorSaturation=1.2
# Multiplier on the spread between light and dark tones.
#colorContrast=1.2
# Enables an edge-sharpening pass on the final image.
#useSharpen=true
# Strength of the sharpening effect.
#sharpenAmount=0.4
# Tone-mapping exponent shaping the overall brightness curve before grading.
#gamma=1.35
# Filmic highlight and shadow roll-off on top of the gamma/contrast/saturation grade: mid-tones are unchanged, bright sky, sun and bloom fade smoothly into white instead of clipping, and deep shadows keep detail instead of crushing to black. False restores the old hard clip.
#useFilmicTonemap=true
# Lights the world in high dynamic range: sun-lit surfaces, glints, fire and the sky near the sun keep their detail instead of clipping to flat white, bloom comes from real brightness, and dark night scenes and fog gradients stop banding.
#useHDRLighting=true
# Brightness where the highlight roll-off starts (0.5 to 0.98). Lower gives softer, more filmic highlights.
#tonemapShoulder=0.85
# Brightness below which the shadow toe starts (0.005 to 0.3). Higher keeps more shadow detail.
#tonemapToe=0.06
# How far the bloom glow spreads (0 = tight around the light, 0.95 = very wide soft haze).
#bloomScatter=0.2
# Faint smudges and dust spots on the virtual lens, visible only around bright light such as the sun, fires and lamps.
useLensDirt=false
# Brightness of the lens dirt.
#lensDirtIntensity=0.6
# Subtle animated film grain, the same size at any resolution. Also hides colour banding in fog and sky gradients.
#useFilmGrain=true
# Grain strength (0.02 is subtle; 0.05 is clearly visible).
#filmGrainStrength=0.02
# Cool shadows and warm highlights without changing brightness, following the time of day: strongest at golden hour, subtle at midday, cool at night.
#useSplitToning=true
# Overall split-toning strength (1.0 = default, 0 = off).
#splitToneStrength=1.0

# Enables screen-space reflections on shiny surfaces (wet stone, metal, puddles), reflecting real nearby geometry instead of a flat highlight.
useSSR=false
# Overall strength multiplier for how visible reflections are.
#ssrIntensity=0.6
# How far, in world units, the reflection ray searches before giving up.
#ssrMaxDistance=8.0
# Number of samples along the reflection ray - more catches thinner reflected detail, at more cost.
ssrSteps=8
# View-space units the reflection ray's start point is pushed off the surface along its normal
# before marching, so it can't immediately re-hit the surface it started on (ghost self-reflection).
#ssrBias=0.15
# Diagnostic: replaces the screen with a grayscale view of each surface's shininess value. Used to read real in-game values before tuning metal-reflection thresholds - leave off otherwise.
#debugVisualizeShininess=false
# Forces a shininess/specular floor on ground/dropped items whose real material (MaterialUtilities.isMetal) is a metal, so items whose model was never authored with specular data still show up in SSR.
#useMetalMaterialBoost=true
#metalShininessBoost=0.6
#metalSpecularBoost=0.7
# Metal items (on the ground, held in hand, shields, helmets) and worn metal armour on players and NPCs (plate, chain mail, studs, metal necklaces) reflect light like real metal: sharp sun, moon and lamp highlights and a reflection of the sky and surroundings, tinted by the texture's own colour. The texture colours themselves are never changed. Only the metal parts of a model count - wooden handles, leather and stone stay as they are. Replaces useMetalMaterialBoost when on.
#useMetalReflections=true
# Strength of the sky/surroundings reflection on metal.
#metalReflectionStrength=1.0
# Strength of sun, moon and lamp highlights on metal.
#metalHighlightStrength=1.0
# Ambient light picks up the real surroundings: surfaces facing the sky get its colour, surfaces facing sunlit grass or rock get a hint of that bounce light, overall brightness stays the same. Needs useMetalReflections.
#useProbeAmbient=true
# How strongly the surroundings tint and shape the ambient light (0 = flat vanilla ambient).
#probeAmbientStrength=0.7
# Shiny non-metal surfaces (wet stone, polished wood, glazed pottery, puddles) use a physically based highlight: same strength as before when seen from the front, and noticeably stronger toward grazing angles, like real surfaces at sunset. Reflections on puddles and wet ground follow the same rule (faint looking straight down, strong at a distance).
#useDielectricSpecular=true
# Upper limit for how much stronger a highlight can get at grazing angles compared to a front view.
#specularGrazingBoost=3.0
# Eye adaptation: when you walk into a cave or a dark house the image slowly brightens, and very bright scenes (snow, glare) are toned down a little. Normal daylight is left exactly as it is.
#useAutoExposure=true
# How strongly the eye adapts once a scene is clearly darker or brighter than normal daylight (0 = off, 1 = full).
#autoExposureStrength=0.7
# Maximum brightening in caves and dark interiors.
#autoExposureMax=2.0
# Maximum darkening in very bright scenes.
#autoExposureMin=0.8
# Maximum brightening outdoors at night, so nights stay dark.
#autoExposureNightMax=1.2
# Adaptation speed (higher = faster). Getting used to the dark takes longer than getting used to bright light.
#autoExposureSpeed=1.0

# Enables a subtle red/blue color-fringing effect toward the screen edges, mimicking a real camera lens.
#useChromaticAberration=true
# How far the red and blue channels shift apart at the screen edge.
#chromaticAberrationStrength=0.0007

# Replaces vanilla's low-health/death screen effect (a smoky red/black "ghost" wipe) with a procedural translucent blood stain with drips and a heartbeat pulse that fades in slowly once health drops below bloodScreenHealthThreshold.
#useBloodScreenEffect=true
# Opacity multiplier for the blood stain and edge darkening.
#bloodScreenIntensity=1.0
# Health fraction (0.01-0.5) below which the blood starts to appear; it reaches full strength just before death. The game only runs this effect below 50% health, so higher values act like 0.5.
#bloodScreenHealthThreshold=0.2

# Enables a lens-style depth of field: focus follows the screen centre, out-of-focus areas blur with round bokeh. Off by default, since it changes visibility of distant things, not just looks.
useDepthOfField=false
# True: focus distance follows whatever is at the screen centre. False: focus stays at dofFocusDistance.
#dofAutoFocus=true
# How quickly auto-focus catches up to a new target (higher is snappier).
#dofFocusSpeed=6.0
# World-space distance in metres kept in focus when dofAutoFocus is false.
#dofFocusDistance=15.0
# Size of the sharp zone around the focus distance, as a fraction of that distance (0.15 = plus or minus 15 percent).
#dofFocusTolerance=0.15
# Overall blur amount, scales dofMaxBlur (1.0 = full).
#dofAperture=1.0
# Largest blur radius in pixels at full resolution.
#dofMaxBlur=1.0
# Where the blur band along the screen border begins, as a fraction of the distance from screen centre to the edge (0.95 gives a very narrow band; lower widens it). 0 blurs by depth everywhere.
#dofEdgeStart=0.95
# Samples per pixel for the bokeh blur (8 to 96). More is smoother but slower.
#dofBokehQuality=32

# Screenshots render the world at this multiple of the window resolution (2.0 = double width and height). The HUD is left out of these. Causes a brief hitch when taking one. 1.0 restores vanilla window-sized screenshots with the HUD. Timelapse screenshots always stay at window size.
#screenshotScale=2.0
# The "record <seconds> [fps]" console command saves an mp4 video to your screenshots folder, with the HUD hidden while it records. Frames per second when no fps is given.
#recordFps=30
# Video quality of "record": lower is better and bigger files (18 = visually lossless, 23 = smaller, 0-51).
#recordQuality=18
# Full path to ffmpeg.exe (or its folder) for "record". Empty = look on PATH, in mods/skloGraphics and in Program Files; if it is
# nowhere, the first "record" downloads ffmpeg once (115 MB, checksum-verified) into mods/skloGraphics/ffmpeg and then starts recording.
#recordFfmpegPath=
# How strongly bright points bloom into visible bokeh discs (0 = flat blur).
#dofBokehBrightness=1.5
# Blur things closer than the focus distance, including over sharp areas behind them.
#dofNearBlur=true
# Blur the sky at maximum strength. False keeps the sky sharp.
#dofSkyBlur=true

# Amplifies bump-map depth and boosts ambient/specular contrast so surfaces read with more 3D relief.
#useLightingBoost=true
# Distance in metres out to which terrain keeps its normal map (the bumpy 3D look of cobblestone, gravel, slabs). Fades out over the last sixth. Vanilla is 60.
#terrainNormalMapRadius=360.0
# Per-pixel parallax relief on near terrain: raymarches a height field in the terrain gbuffer shader
# so paved and loose ground reads as real 3D and the relief parallaxes correctly as you move. The
# height field is NOT procedural: it is a high-pass of the ground texture's own brightness (a sharp
# sample against its own blurred local mean), so the relief lands exactly on the mortar/highlight
# structure already painted into the texture instead of forming a second, offset set of stones.
# Covers cobblestone, gravel, planks, slabs, bricks, rock, dirt, sand and clay; grass and other
# vegetation are left flat. Deferred rendering only.
#useTerrainPOM=true

# Draws buildings, objects and grass before the ground, so the expensive ground shading is skipped
# for every pixel they cover. The picture does not change. Deferred rendering only.
#useTerrainLateDraw=true

# Finds what is under the mouse without making the game wait for the graphics card each frame. The
# hover result arrives a frame or two later, which is only noticeable at very low frame rates.
#useAsyncPick=true

# Which way the relief reads - see useTerrainPOMBumpMode's own comment in SkloGraphics.java for the
# full mechanism. true: brighter-than-neighbourhood texels (a stone's lit top) poke UP as bumps,
# mortar/creases stay flush. false (default): the original behaviour - darker-than-neighbourhood
# texels (mortar, creases) sink DOWN as pits, stone tops stay flush. Flip and restart to compare;
# this is baked into the shader at mod load, not a live-tunable uniform.
#
# Defaulted back to false (pit mode): bump mode still doesn't look good in-game even after the
# pomHeightBlurRadius/pomStrength/pomNormalStrength retune below, most likely because the game's own
# baked terrain normal maps aren't detailed/matched enough to carry the extra shading contrast bump
# mode leans on. Pit mode is the original, previously-shipped behaviour and unaffected by that
# problem. The bump code stays in and tuned in case better source normal maps (or a different
# shading approach) make it worth revisiting - flip this to true to compare.
#
# pomGrooveLow/pomGrooveHigh below were measured against the PIT direction's brightness distribution
# (how much darker mortar gets than its surroundings) - bump mode measures the opposite tail (how
# much brighter stone tops get), which is not necessarily distributed the same way. If the bump
# effect looks too subtle or too extreme, re-tune those two before assuming something is broken.
#useTerrainPOMBumpMode=false
# Global multiplier on each material's real relief depth (3cm for cobblestone mortar, 1cm for slab
# joints, and so on - the per-material table lives in TerrainPOM.java). 1.0 means "use the physical
# depth". Above roughly 2.0 the parallax offsets out-run what pomTravelLimit can hide and the
# ground starts to look like it is sliding under the camera rather than having depth. Went
# 2.1 -> 1.3 -> 1.7: 2.1 read as exaggerated in bump mode (a raised feature reads as bigger/more
# dramatic than the same magnitude as a pit), but 1.3 alone was barely visible - because the height
# field feeding it was noisy (see pomDetailSize/pomNormalSmoothing below), so turning strength back
# up just amplified the noise along with the real relief. pomHeightBlurRadius below now does a real
# multi-tap blur of the height field itself rather than just relocating a single sample, so 2.1 is
# worth it again without reintroducing the noise.
pomStrength=1.2
# Relief is at full strength inside pomFullQualityRadius and fades linearly to nothing at pomRadius,
# both in metres. Beyond the 64m high-detail terrain band the ground texture is coarser, so the relief
# there softens on its own (the height field never gets sharper than the pixel reading it). The tile
# amplitude grid around the camera sizes itself from pomRadius automatically.
#pomFullQualityRadius=64.0
pomRadius=120.0
# Raymarch step counts. The linear search scales between max (looking along the ground, where the
# ray travels furthest through the height field) and min (looking straight down, where it barely
# travels). pomRefineSteps is the binary search that follows and is what actually sets precision -
# each step halves the remaining interval, so 5 of them beat 32 extra linear steps for far less cost.
# Lower all three if terrain costs too much.
pomMaxSteps=16
pomMinSteps=6
pomRefineSteps=4
# The two sample footprints the height field is built from, IN METRES: pomDetailSize is the sharp
# sample, pomBlurSize is the local mean it gets compared against. Both are converted to mip levels
# from the measured texel density, so they keep meaning the same real-world size on every terrain
# LOD. pomBlurSize wants to be about one cobble across (a stone is ~20cm, mortar ~3cm) - too small
# and it tracks the very mortar it is meant to detect, too large and slow colour variation across
# the tile starts registering as relief.
# Both are a FLOOR on the mip level, not the mip level itself. A fixed real-world 6mm detail sample
# is undersampled the moment one screen pixel covers more ground than that, which is what made
# distant terrain sparkle - every frame it point-sampled a different sub-pixel feature. The shader
# takes max(this, the ordinary screen-space mip level), so the height field can never be sharper
# than the pixel reading it, and holds the blur tap 1.5 levels above the detail tap so the high-pass
# never collapses to zero. Relief now fades out on its own with distance instead of aliasing.
# pomDetailSize raised from 0.006 to 0.012: at 6mm the sharp tap was close enough to raw texture
# data up close that single noisy texels (a stray bright pixel, compression artefacting) could
# spike the height field on their own - read as "unnatural peaks" once that field drives real
# parallax and shading rather than just a flat texture. Doubling it pulls the sharp tap one mip
# level coarser, which is the GPU's own mip chain pre-blurring the input for free.
#pomDetailSize=0.012
#pomBlurSize=0.10
# Second, independent smoothing lever: widens the footprint (in metres) the height field's GRADIENT
# is measured across for normal-based shading, without touching pomDetailSize/pomBlurSize's own
# sample sizes or costing any extra texture reads. The gradient defaults to a ~2-texel central
# difference - fine enough to turn single-texel noise into a real slope that pomNormalStrength then
# amplifies into visible speckle. Widening this turns the gradient into a genuine local average of
# the surrounding relief instead, which is what actually removes speckle rather than just capping
# its worst case. 1.0 is the original, minimal footprint (also the floor - values below 1.0 clamp
# to it); raise further for softer-looking relief at the cost of losing genuinely small detail too.
#pomNormalSmoothing=3.0
# Real multi-tap smoothing of the height field's sharp/detail sample, on top of everything above.
# pomDetailSize/pomBlurSize/pomNormalSmoothing all just choose WHERE a single texture read lands
# (a coarser mip, a wider gradient spacing) - none of them average multiple samples, so one isolated
# noisy texel (compression artefacting, a stray highlight) could still spike straight through and
# read as an "unnatural peak" once pomStrength/pomNormalStrength amplify it. This takes 5 taps (the
# centre plus 4 diagonal offsets, same mip as the plain detail sample) and averages them - a real
# box/tent blur - before the value reaches the raymarch, the cavity darkening, or the normal
# gradient, so the silhouette and the shading stay consistent with each other. In TEXELS of the
# detail mip, scaled internally so it stays a constant real-world size at every distance, the same
# trick pomDetailSize/pomBlurSize already use. 0 disables the extra taps (single sample, original
# cost). Costs 4 extra texture reads per height-field lookup, so roughly 4x the texture traffic of
# the relief effect as a whole - only paid within pomRadius, after every other fade.
pomHeightBlurRadius=0.8
# Maps "this texel is this much darker than its neighbourhood" onto depth 0..1. Set from the real
# distribution, not by eye - decoding texture/terrain/cobble.dds (512px over one 4m tile) and
# high-passing it at the pomBlurSize radius gives a median texel (a stone face) at about 0.00 and a
# mortar tail running out to 0.22 on cobble, 0.29 on cobble2, 0.31 on gravel, 0.14 on marble slabs.
# So 0.0 keeps stone faces genuinely flat and 0.20 uses the whole depth range; a lower ceiling makes
# everything past the 90th percentile clip to the same value, which flattens the grooves into a
# plateau and is exactly what "no 3D effect" looks like. Raise pomGrooveHigh for shallower, softer
# grooves; lower it if dark patches in the ground texture dig visible pits.
#pomGrooveLow=0.0
#pomGrooveHigh=0.20
# Cavity darkening in the grooves. Free (the depth at the ray hit is already known) and it carries
# most of the perceived depth, since the gbuffer pass has no sun direction to self-shadow against.
# Only applies in PIT mode (useTerrainPOMBumpMode=false) - bump mode forces this to 0 on the Java
# side, since darkening the ray hit would shade the raised, sun-facing stone tops as if recessed.
#pomAmbientOcclusion=0.85
# How much extra normal detail to derive from the height field's own gradient, on top of the game's
# baked terrain normal map (which is already resampled at the parallax-shifted position and stays the
# main source of shading). Costs 4 extra texture samples, so 0.0 is a real quality/performance lever.
# Lowered from 1.35 to 0.85 alongside pomStrength, then raised to 1.5 alongside it: each round of
# noise-suppression on the height field (pomNormalSmoothing, now pomHeightBlurRadius actually
# averaging samples instead of just relocating one) removed another layer of the original "amplifying
# noise into speckle" concern, so this keeps climbing back toward - and now past - the height field's
# own raw slope.
pomNormalStrength=0.8
# Caps how far the ray may travel HORIZONTALLY, as a multiple of the relief depth. The march length
# is depth/|view.y|, which blows up as the view flattens toward the ground - and ground is looked at
# from a flat angle nearly all the time, which is exactly where the parallax is most dramatic and
# most worth having. Fading the effect out there is the obvious fix but throws away the best case;
# limiting the travel instead means a grazing view simply cannot reach the bottom of a groove, so the
# relief flattens off smoothly rather than smearing or vanishing. 4.0 is a floor of about 14 degrees.
# Raise for deeper-looking grooves down a long road, lower if you see stretching.
#pomTravelLimit=5.5
# Relief fades out when the view meets the ground flatter than this, measured against the ground's own
# surface (so slopes rising in front of you keep their relief). 0.03 is under 2 degrees: pomTravelLimit
# already keeps flat views safe, so this is only a safety net right at the horizon. Raising it makes
# the effect stop much closer to you, since distant ground is always seen at a flat angle.
#pomGrazingFade=0.03
# Relief fades out on very steep ground: full strength while the surface-normal Y is above
# pomSlopeFade + 0.25 (about 49 degrees at 0.4), gone below pomSlopeFade (about 66 degrees). The ground
# texture is projected straight down, so near-cliffs stretch it and are left alone.
#pomSlopeFade=0.4
# Diagnostic view, replaces terrain colour. 0=off, 1=height field greyscale, 2=per-tile amplitude,
# 3=parallax offset magnitude (red), 4=linear-search step count (green=cheap, red=max).
#pomDebugView=0
# Plough furrows on farm fields: real 3D ridges and furrows with parallax, placed exactly on the furrows painted in the field texture (also the winter one), light and shade on the ridge sides, darker soil down in the furrows and small soil clods. Crops stand on the ridges. Rain puddles and shoreline water collect in the furrows first. Needs useTerrainPOM.
#useFieldFurrows=true
# Ridges per tile (a tile is 4 m wide), only used if the field texture has no painted rows of its own. 2 to 8.
#fieldFurrowsPerTile=4
# Height from furrow bottom to ridge top, in metres.
#fieldFurrowDepth=0.15
# Untended fields have flatter, weathered furrows: this share of the full height.
#fieldFurrowUntendedDepth=0.6
# Furrows flatten out over this distance in metres at the border of a field.
#fieldFurrowEdgeFade=0.5
# Next to paving, roads and other hard tiles the furrows start flat and only reach full height this far into the field, in metres (0.1 to 2), so no pavement shows down in the furrows.
#fieldFurrowHardEdgeFade=1.5
# Small soil clods on the ridges (0 = smooth ridges).
#fieldFurrowClods=0.1
# How much darker the soil is down in the furrows (0 = not at all, 1 = black).
#fieldFurrowValleyDarkening=0.15
# How much lighter the dry soil is on top of the ridges.
#fieldFurrowCrestLift=0.05
# How strongly the ridge sides catch and turn away from the light (1 = true shape).
#fieldFurrowNormalStrength=1.3
# Crop plants, pumpkins and cabbages grow in rows on top of the ridges instead of being scattered across them.
#alignCropsToFurrows=true
# Crops on fields (wheat, potatoes, corn, carrots and all the others that were flat rows) grow as real 3D plants like the grass: stems, leaves, ears, flowers and fruit that change with every growth stage, sway in the wind and part around you. Without deferred shading they fall back to crossed cards cut from the crop picture (needs tile decorations at Medium or higher).
#use3DCrops=true
# How far away 3D crops are drawn, in metres. Plants thin out smoothly towards this distance.
#cropRenderDistance=140.0
# Up to this distance (metres) every plant is drawn; further away fewer, slightly wider plants keep the field full.
#cropFullDensityRadius=22.0
# Height of the 3D crop plants (1 = natural height).
#cropHeightScale=1.0
# Brightness of the 3D crop plants.
#cropBrightness=1.0
# How strongly 3D crops sway in the wind (0 = still).
#cropWindStrength=1.0
# Real 3D relief on houses, walls, fences and tree trunks (never on creatures, players, NPCs or items): mortar joints, plank gaps and bark grooves sink into the surface and shift with the view (parallax), with matching shading. Works with or without the game's normal-map option; never on leaves or near see-through edges.
#useStaticPOM=true
# Relief depth in metres.
pomStaticStrength=0.03
# Smallest feature that can become a groove, in metres. Specks and grain finer than this stay flat (no "Swiss cheese" pitting).
#pomStaticDetailSize=0.03
# Size of the area each point is compared with to find grooves, in metres. Joints and gaps are darker than this surrounding area.
#pomStaticBlurSize=0.12
# Relief fades out by this distance in metres (main cost control - lower if buildings get expensive).
#pomStaticRadius=28.0
# Full quality up to this distance in metres.
#pomStaticFullQualityRadius=10.0
# How much darker than its surroundings a spot must be to sink in: below Low = flat, at High and above = full depth, gradual in between. Measured on the house stone, brick and plank textures.
#pomStaticGrooveLow=0.02
#pomStaticGrooveHigh=0.12
# How much the bottom of a groove is darkened (0 = not at all, 1 = black).
#pomStaticAmbientOcclusion=0.55
# How strongly the relief bends the lighting at groove edges. Higher = crisper edges but brighter glints next to lamps.
pomStaticNormalStrength=0.35
# Deep 3D bark on tree trunks (needs use3DCanopyLighting): furrows and plates sink in with parallax, crevices darken,
# and the sun casts small shadows inside the bark that move with the time of day. Leaves are never touched.
#useBarkRelief=true
# Furrow depth relative to the width of the bark pattern - bigger, older trunks get deeper bark.
#barkReliefDepth=0.6
# Deepest a furrow can get, in metres.
#barkReliefMaxDepth=0.05
# Bark relief fades out by this distance in metres.
#barkReliefRadius=60.0
# Full quality up to this distance in metres.
#barkReliefFullQualityRadius=24.0
# How much darker than its surroundings a spot of bark must be to sink in (Low = starts, High = full depth). Measured on all the game's bark textures.
#barkGrooveLow=0.01
#barkGrooveHigh=0.10
# How strongly the bark relief bends the lighting at furrow edges.
barkNormalStrength=0.5
# How much the bottom of a furrow is darkened (0 = not at all, 1 = black).
#barkAmbientOcclusion=0.45
# How dark the sun's shadows inside the bark furrows are (0 = no bark self-shadowing, 1 = full).
#barkSelfShadow=0.7
# Softens harsh single-texel jaggies on textures with a light blur, without touching normal-map detail.
#useTextureSmoothing=true

# Forces the hover/pick outline color for plain tiles and items (vanilla's dull blue) to a warm white-gold, overriding whatever's in your saved settings for it. Does not affect ally/friend/hostile/GM outlines.
#useHoverOutlineColor=true
#hoverOutlineColorR=1.0
#hoverOutlineColorG=0.92
#hoverOutlineColorB=0.65
# Opacity of the hover outline (0 = invisible, 1 = fully opaque).
#hoverOutlineColorA=0.6

# Breaks up grass/dirt/sand tile-transition edges from a flat bilinear gradient into an organic, patchy boundary.
#useOrganicTileBlend=true
# How far a decoration sprite (grass blade etc) can spill past its tile edge into a texture-differing neighbor, in world units.
#decorationOverlapDistance=0.7
# Per-eligible-corner chance of a decoration sprite actually spilling over an edge.
#decorationOverlapChance=0.65
# Re-enables tile-blend transitions on hard-surface tiles (cobblestone, gravel, slabs, bricks, planks) that vanilla excludes entirely, so their edges aren't a razor-straight line and don't wrongly blend against an unrelated neighbor.
#useHardSurfaceTileBlend=true
# How far the (hard-stepped, no opacity blend) boundary line wanders on edges touching a hard-surface tile. 0 is a perfectly straight line.
#hardSurfaceBlendStrength=0.35
# Same as hardSurfaceBlendStrength, but applies instead of it wherever two hard tiles meet (stone slabs, bricks, cobblestone, planks, gravel ...) - much lower than the hard/soft case for a near-straight edge between two pavings.
#hardHardBlendStrength=0.06
# The same for the diagonal line of a diagonal road tile between two hard surfaces (e.g. bricks beside slabs). Only that line - ordinary tiles keep hardHardBlendStrength. 0 is a perfectly straight diagonal.
#diagonalHardBlendStrength=0.04
# How rounded paving corners are where three or four different surfaces meet. 1.0 = a wide curve (the neighbouring surface bites deep into the corner), 0 = a sharp right angle. Straight edges are unaffected.
#hardCornerRadius=0.3
# No tile blending between two tiles whose surfaces meet at a sharper angle than this (degrees), e.g. a flat floor at the foot of a cliff - the edge stays a clean line instead of the floor texture splashing up the wall. 180 = always blend.
#tileBlendMaxFoldAngle=50

# Replaces vanilla's flat skybox with a procedural atmosphere, stars, and horizon glow.
#useProceduralSky=true
# Strength of the simulated atmospheric light scattering.
#skyScatteringIntensity=1.0
# Extra color saturation applied to the sky.
#skySaturationBoost=1.05
# Strength of the sunset/sunrise color glow.
#skySunsetIntensity=1.0
# How much ground fog bleeds its color up into the sky near the horizon.
#skyFogIntensity=1.0

# Volumetric height fog for the weather's fog. At low fog values it is a ground fog that fills valleys and low land up
# to fogLayerHeight and fades out softly above - from a mountain you look out over a sea of fog. As the fog value rises,
# the fog layer climbs higher and an even fog fades in, until at 100% it looks exactly like the game's normal thick fog.
# Water, sky, sun, clouds and god rays all follow it (the sky stays clear and the sun visible when you stand above the fog).
#useVolumetricFog=true
# Height in metres (about 1/10 of the in-game slope/height value, so 70 = height 700) the low ground fog reaches.
#fogLayerHeight=70
# Height in metres the fog layer climbs to as the fog value rises toward 90% (it starts rising from about 15%).
#fogLayerMaxHeight=900
# How softly the fog layer thins out above its top, in metres. Larger = a blurrier, taller transition.
#fogLayerFalloff=10
# Thickness inside the fog layer at strong fog (per metre); light fog uses a fraction of it. 0.03 = about 100 m visibility.
#fogLayerDensity=0.03
# How fast the fog thickens as the fog value rises. Higher = light fog stays thin and only heavy fog gets dense.
# 1 = linear, 2.2 = default. Full thickness is reached at 80% fog.
#fogLayerDensityCurve=2.2
# Rolling fog banks: how many metres the top of the fog layer rises and sinks across the land (drifts with the wind).
#fogLayerVariation=25
# How brightly the fog glows toward the sun (light scattering through the fog). 0 = flat fog colour.
#fogSunGlow=0.6
# Mist over water: on calm, dry mornings and evenings a low mist forms over lakes and the sea and drifts in banks
# and wisps. It does not happen every day - more often in spring and autumn, never in wind or rain - and burns off
# once the sun climbs. It is worked out from the game clock and the server's weather, so everyone sees the same mist.
#useWaterMist=true
# Thickness of the mist right on the water at its strongest (per metre). 0.012 = about 150-200 m visibility in it.
#waterMistDensity=0.012
# How often mist days happen. 1 = realistic, 2 = about twice as often, 0 = never.
#waterMistFrequency=1.0
# How brightly the mist glows when you look toward a low sun through it.
#waterMistSunGlow=1.4
# Moonlit nights: once the sun is well below the horizon, the visible moons light the world as a dim, cool silver
# directional light - crisp moon shadows, silvery highlights on wet ground, a glittering moon path on the water, light
# shafts through trees and mist and a glow in the fog around the moon. The night itself turns low-key and blue: darker
# navy sky light and a night colour grade that cools and desaturates the dark parts of the image like real night vision,
# while fires, lamps and the moon keep their colour. Moon brightness follows the moons: their phase, their size, how high
# they stand and the cloud cover. The sun light fades out just after sunset and the night fades in through dusk.
#useMoonLight=true
# Brightness of the moonlight under a big full moon high in a clear sky. 0.14 = moonlit but still clearly night.
#moonLightIntensity=0.14
# How much clouds dim the moonlight (0..1). 0.75 = a fully overcast night keeps a quarter of it.
#moonLightCloudDimming=0.75
# Brightness of the night sky light compared to the game's own (0..1). Lower = darker, moodier nights.
#nightAmbientScale=0.7
# How strongly the night sky light is tinted deep blue (0..1), keeping its brightness.
#nightAmbientTint=0.35
# Night colour grade (0..1): cools and desaturates the dark and mid tones at night, leaving bright and fire-lit parts
# alone. 0 = off.
#nightColorGrade=0.6
# Brightness of the moonlight shafts (volumetric light) through trees, fog and mist. 0 = no moon shafts.
#moonShaftIntensity=1.5
# How brightly the fog glows toward the moon. 0 = no glow.
#moonFogGlow=0.6
# Permanent light atmospheric haze toward the horizon, independent of the weather's fog: always present, capped so it
# never gets strong. It varies a little with humidity (clouds, rain), low sun (morning/evening haze), the height of the
# terrain it looks across and a slow natural drift, and takes the colour of the sky's light.
#useDistantFog=true
# Base haze thickness per metre. 0.00012 = about 11% haze at 1 km.
#distantHazeDensity=0.00012
# Distance in metres before the haze starts.
#distantHazeStart=150
# Maximum haze opacity (0..0.6) - the far horizon never gets hazier than this.
#distantHazeMax=0.4
# Haze thins out with altitude: the height in metres over which it drops to about a third. Far mountain tops stay clearer.
#distantHazeScaleHeight=700
# How wide the sunrise glow band is around the horizon.
#skySunriseBandWidth=0.40
# How wide the sunset glow band is around the horizon.
#skySunsetBandWidth=0.45
# Brightness multiplier for clouds at night, tuned so they stay visible without washing out.
#cloudNightBrightness=1.6
# Fades moon sprites in at night and out by day instead of leaving them fully opaque always.
#useMoonDayNightFade=true
# Faintest the moon ever gets, even at high noon.
#moonMinOpacity=0.12
# Most solid the moon ever gets, even on the darkest night.
#moonMaxOpacity=0.6

# Replaces vanilla's rainbow sprite with a single soft bow fading from red to violet, at the real rainbow size. Shows only when a real one could: visible rain above freezing, the sun breaking through a gap in the clouds (none under a closed deck or in a downpour), and the sun in the morning/evening window but not too close to the horizon. Every shower's bow differs a little in brightness and width. Type "rainbow" in the dev console to force-preview it (a new random look each time).
#useProceduralRainbow=true
# Overall brightness multiplier.
#rainbowIntensity=1.0
# Colour saturation (0 = white bow, 1 = normal, higher = more vivid).
#rainbowSaturation=1.0
# Lowest sun height in degrees a rainbow appears at (full strength 5 degrees higher). Lower values allow early-morning/late-evening bows, which take on the red sunrise/sunset tint.
#rainbowMinSunElevation=12.0

# Replaces vanilla fireworks (a tiny 3 m puff) with real aerial shells: a rocket climbing on a spark tail, bursts 200+ m up and over 100 m across with trails, a flash that lights the ground, drifting smoke and the bang arriving after the light. Five shell styles (peony, chrysanthemum, golden willow, rings, crossette with crackle) for the server's five firework types. Type "fireworks", "fireworks 5".."fireworks 9" or "fireworks show" in the dev console to preview.
#useSkyFXFireworks=true
# Size of the firework shells (height, burst size, stars). 1.0 = bursts ~200-270 m up, ~140 m across.
#fireworksScale=1.0
# Replaces the look of the meteor strike: a blazing bolide streaking in across the sky with a plasma tail and a long smoke trail, then a flash, fireball, flying debris, a dust shockwave and a mushroom cloud. It still lands on exactly the same tick as vanilla's. Type "meteor" in the dev console to preview one (falls in 20 s).
#useSkyFXMeteors=true

# Replaces the flat flame sprites of campfires, forges, ovens, fireplaces and other fires with a real 3D flame: rising, swirling tongues coloured by heat (white-yellow over the embers, orange tongues, red tips) that look right from every side and from above, plus glowing embers that pop out, swirl up in the hot air and drift with the wind. Same size as vanilla's flames; the fire's light, smoke, sound and heat haze stay as they are.
#useFireFX=true
# Replaces the smoke of those fires with a real smoke plume: soft, billowing, slowly turning puffs that rise fast out of the flames or the chimney, slow down, widen and get carried off by the wind the higher they climb (25-30 m, vanilla's ~17 m). Lit like the scene - bright on the sun side, darker underneath, a silver rim against the sun, dark at night with the fire's warm glow on its underside. Needs useFireFX.
#useFireSmoke=true
# Burning creatures such as lava spiders get their own fire: small flame tongues that flare up and die out all over the body and follow it on slopes, plus embers and a smoke trail - instead of the campfire flame that covered them. How strong the flames and embers are (0 = invisible, 1 = full). Their light stays the same. Needs useFireFX.
#creatureFireOpacity=0.45
# How thick the smoke trail of burning creatures is (0 = none, 1 = as thick as a campfire).
#creatureFireSmoke=0.6
# Size of the meteor's fireball, trails, impact and smoke.
#meteorScale=1.0

# Coverage of the flat (non-volumetric) cloud layer.
#skyCloudDensity=0.5
# Drift speed of the flat cloud layer.
#skyCloudSpeed=1.0
# How dark the underside of flat clouds gets.
#skyCloudDarkness=0.45
# Brightness of the procedural star field.
#skyStarIntensity=1.0
# How many stars appear per unit of sky.
#skyStarDensity=1.0
# Brightness of the Milky Way band across the night sky (only visible in full darkness). 0 turns it off.
#skyMilkyWayIntensity=1.0
# Makes the star sky and Milky Way turn with the planet: in step with the sun, around the same pole, once per game day. Shooting stars are unaffected.
#skyStarRotation=true

# Enables raymarched 3D clouds instead of the flat cloud layer.
#useVolumetricClouds=true
# Enables the volumetric clouds drifting over time.
#useCloudVolMovement=true
# Raymarch steps through the cloud volume itself - more costs more, looks less banded.
#cloudVolPrimarySteps=64
# Raymarch steps toward the sun used for cloud self-shadowing.
#cloudVolLightSteps=6
# How much of the sky the volumetric clouds cover.
#cloudVolCoverage=0.5
# Drift speed of the volumetric clouds.
#cloudVolSpeed=1.0
# Altitude the cloud layer starts at.
#cloudVolBaseAltitude=3.5
# Altitude the cloud layer ends at.
#cloudVolTopAltitude=5.5
# How much light the clouds absorb, controlling how dense/opaque they read.
#cloudVolAbsorption=1.0
# Strength of the bright rim clouds get when backlit by the sun.
#cloudVolSilverLining=0.5
# Stylized radius of the planet the volumetric cloud dome curves around - smaller bends the sky
# more (clouds visibly sink toward the horizon), larger flattens it back toward the old slab look.
#cloudVolPlanetRadius=200.0

# Server rain value (0-1) at which rain starts to show. Falling drops, splashes, puddle and water rings, wet ground, drops on the camera and the rain sound all start together once the rain passes it, and the clouds close in shortly before. The server opens every shower with a few minutes of very light drizzle; 0.1 hides that and matches where the game's own rain sound starts. Higher makes showers start later; lower brings back the drizzle.
#rainStartThreshold=0.1
# Enables denser, better-shaped rain streaks with a brighter leading edge.
#useRainFX=true
# Multiplier on how many rain streaks are drawn. Also sets how many raindrop splashes and water/puddle rings land: half this value per 2x2 m patch, between 3 and 12.
#rainDensity=20.0
# Brightness multiplier on rain streak color.
#rainBrightness=2.2
# Animated raindrop splashes around you: droplets bouncing up off the ground and water, and a small impact flash.
#useRainSplashes=true
# Size of those splashes (1 = true-to-life size; a little larger reads better at game camera distances).
#rainSplashSize=1.3

# Enables wet ground and standing puddles while it rains. Puddles form on flat ground and in the low spots of the ground relief, grow the longer it rains and dry out slowly afterwards. They mirror the sky and surroundings like real water: dark at night, bright toward the horizon, with the sun, moon and lamps reflected in them.
#useWetGround=true
# How much wet ground darkens compared to dry.
#wetGroundDarkness=0.5
# Strength of the sun, moon and lamp reflections in puddles.
#wetPuddleIntensity=1.0
# Size of the puddle pattern across the ground (higher = smaller, more frequent puddles).
#wetPuddleScale=1.0
# Speed of the light wind ripples on puddle surfaces.
#wetRippleSpeed=1.0
# Strength of the raindrop rings on puddles. The rings use the same drops as the rain splashes, so each ring starts where a splash lands; rain intensity only changes how many drops fall, not how strong a ring is.
#puddleRippleStrength=1.0
# Rain water running down hard ground that is too steep for puddles: rock, cliffs, cobblestone, slabs, bricks, planks and gravel. The water is simulated around you (about 18 m each way): raindrops gather until they break loose and slide, streams find their own way through the stone, meander, merge and split, wide where much water meets and a thread where little does, and leave dark wet trails behind. Gullies and gutters get the water from further up the slope. The water mirrors the sky, sun and lamps like the puddles do, and drains away within a minute after the rain. Needs useWetGround.
#useRainFlow=true
# How much rain reaches the ground (higher = more and wider streams).
#rainFlowIntensity=1.0
# How readily the water runs (higher = faster, longer streams; lower = more drops that cling).
#rainFlowSpeed=1.0

# Fakes subsurface light transmission through grass blades - grass glows when backlit by the sun.
#useGrassTranslucency=true
# Strength of the backlit grass glow.
#grassTranslucencyStrength=0.5

# Enables subtle rain droplets rendered on the camera lens itself while outdoors in the rain.
#useCameraRainDrops=true
# Overall opacity/refraction strength of the camera lens droplets.
#rainDropIntensity=0.5

# Falling snow stays where it is in the world, so you walk, ride and fly through the flakes. They vary in size and speed, flutter, and drift with the wind.
#useSnowFX=true

# Master switch for god rays and lens flare around the sun.
#useSunFX=true
# Enables visible light shafts radiating from the sun.
#useGodRays=true
# How quickly god ray brightness falls off with distance from the sun.
#godRayDecay=0.99
# How far each god ray sample marches toward the sun per step.
#godRayDensity=0.85
# Overall brightness of the god ray effect.
#godRayIntensity=1.1
# How visible god rays are crossing open sky/air, not just where they land on the ground (0=old
# ground-only look, 1=sky as bright as the ground).
#godRaySkyVisibility=0.5
# In-game hour god rays start fading in during the morning.
#godRayMorningHour=9.0
# In-game hour god rays start fading out in the evening.
#godRayEveningHour=16.0
# Enables a lens flare effect when looking toward the sun.
#useLensFlare=true
# Overall brightness of the lens flare.
#lensFlareIntensity=0.12
# How quickly god rays/lens flare fade as the sun becomes visible or occluded.
#sunFadeSpeed=2.0

# Volumetric god rays: light shafts through trees/buildings traced in world space through the sun
# shadow maps, so they show in every view direction (not only toward the sun). Only lit air next
# to shadowed air (a real shaft) is kept - flat haze is removed so open sky never washes out.
#useVolumetricLight=true
# How far from the camera (world units, ~meters) shafts are traced before fading out.
#volumetricDistance=100.0
# Ray-march samples per pixel (4-32). Higher = crisper shafts, more GPU cost.
volumetricSteps=16
# Render resolution divisor for the shafts (1=full, 2=half, 4=quarter). Higher = faster, softer.
#volumetricResolutionDivisor=2
# Air density. Higher = more and brighter shafts.
#volumetricDensity=0.03
# Overall brightness of the shafts.
#volumetricIntensity=2.5
# Forward scattering (0=same in all directions, 0.9=only visible toward the sun).
#volumetricAnisotropy=0.35
# Share of direction-independent scattering, keeps shafts visible with the sun behind you (0-1).
#volumetricIsotropy=0.6
# How quickly the air thins with height above the player (per world unit).
#volumetricHeightFalloff=0.01
# Extra air density in fog (fog also shortens the shaft distance).
#volumetricFogDensityScale=1.5
# How strongly flat lit air is removed so only shaft edges remain (0=plain haze, 1=pure shafts).
#volumetricContrast=1.0
# Share of plain haze added back on top of the shafts (0-1). Higher washes out open areas.
#volumetricHazeKeep=0.02
# Maximum brightness shafts can add to a pixel (0-1).
#volumetricMaxBrightness=0.65
# How golden the shafts are tinted (0=raw sunlight colour, 1=full golden-hour tint; it gets more orange as the sun sinks).
#volumetricWarmth=0.85
# Length of the beam streaks along the light direction, as a fraction of screen height (0=off).
#volumetricStreakLength=0.08
# Shaft strength with the sun high overhead, relative to low morning/evening sun (0-1). Real light shafts are strongest at golden hour and faint at midday.
#volumetricNoonScale=0.45
# Strength of the light shafts through trees and fog at sunrise and sunset, 0-4. Above 1 makes golden-hour shafts stronger, below 1 dims them. Fades back to 1.0 as the sun climbs, so midday is unaffected.
#lowSunGlareScale=1.3
# Strength of the glare rays radiating from the sun itself at sunrise and sunset, 0-4. This is the part that blinds when the low sun is in view; lower = less glare.
#lowSunRayGlareScale=0.3

# Widens the ring around the player that renders full 3D "pretty" trees instead of flat billboards.
#useWiderTrees=true
# Radius, in cells, of that pretty-tree ring. Effectively caps out at 8 - vanilla's fixed 16x16
# cell grid means nothing past cell-distance 8 from the player ever exists to render into, no
# matter how high this is set, so 10 behaves identically to 8/9.
#treeCloseRadius=5

# ---------------------------------------------------------------------------- SUN SHADOWS
# Three-cascade, sun-only shadow mapping. Each cascade is its own shadow map; the near one is tiny
# and extremely high resolution, the far one is enormous and coarse, and the mid one bridges them.
# Turning this off falls back to vanilla's single shadow map at vanilla's own sizes.
#useSunShadowCascades=true

# Side length in world units of each cascade's square shadow box - NOT a radius. A cascade set to N
# reaches N/2 out from you in every direction, and a Wurm tile is 4 world units, so these are radii
# of 6 / 25 / 150 tiles.
#
# The near value is deliberately small, and that is what produces detailed close-up shadows: the
# shadow map's texture resolution is fixed, so concentrating it over 48 units instead of the 320
# this used to be set to gives 171 texels across a single tile instead of 13. Tree trunks, canopy
# gaps, creature legs and dropped items all resolve properly at that density. Nothing is lost at
# the edge because the mid cascade takes over with a cross-fade.
#sunShadowNearExtent=48.0
#sunShadowMidExtent=200.0
# The far cascade is meant to be seen a very long way off, not to be sharp - under one texel per
# world unit, so distant trees read as soft blobs. Past about 2000 an individual tree becomes
# smaller than one texel and it starts looking like noise; raise sunShadowFarMapSize with it if you
# push it that far.
#sunShadowFarExtent=1200.0

# How far back along the sunlight each cascade's shadow camera sits, and the furthest a caster can
# be from that camera and still have its depth recorded. Do NOT scale either in step with the
# extents above.
#
# The origin distance sets the shadow box's DEPTH range, not its covered area. What it has to cover
# is how far above and below you geometry sits - tree and building height on one side, terrain
# relief on the other - and that does not grow just because the cascade got wider. Too small and
# tall trees or low ground fall outside the box and stop casting at all.
#
# The cast distance fails in BOTH directions. Too small and distant depths saturate, which makes
# the shadow map report "everything is lit" - the cascade looks switched off. Too large and shadows
# quietly wash out instead, which is the trap worth knowing about: depth is stored divided by this
# value, and the shadow test has a fixed noise floor, so the bigger this gets the more every real
# height difference shrinks toward that floor until the test can no longer tell a tree from the
# ground under it. A canopy 8 units above the ground casts a solid shadow at 1200 and a faint grey
# smudge at 2400. Pick the smallest value that still covers the terrain relief you actually have.
#sunShadowNearOriginDistance=150.0
#sunShadowNearCastDistance=260.0
#sunShadowMidOriginDistance=240.0
#sunShadowMidCastDistance=420.0
#sunShadowFarOriginDistance=420.0
#sunShadowFarCastDistance=1200.0

# Texture resolution per cascade: 0=512, 1=1024, 2=2048, 3=4096. These replace the in-game "Shadow
# Quality" setting, which no longer has any effect. The map is sampled at HALF these sizes (the
# shadow blur pass writes to a half-size target), which is already accounted for in the texel
# counts quoted above. The near cascade at 3 allocates exactly what vanilla's own "Huge" preset
# does, but it is the biggest single video-memory item in this mod - drop it to 2 if VRAM is tight,
# which still leaves 85 texels per tile.
sunShadowNearMapSize=2
#sunShadowMidMapSize=2
#sunShadowFarMapSize=2

# How many cells (64 world units each) around you cast into each cascade. The near cascade is only
# 48 units across, so nothing past the first ring can possibly reach it - keeping these tight is
# what makes three cascades cost less CPU than the two-cascade system this replaced. The far value
# effectively caps at 9: vanilla's cell grid is 16x16, so no cell past distance 8 exists.
#sunShadowNearCasterCells=2
#sunShadowMidCasterCells=6
#sunShadowFarCasterCells=9

# Fraction of each cascade's radius spent cross-fading into the next, so the resolution change is a
# gradient rather than a visible ring on the ground.
#sunShadowCascadeBlend=0.2

# Light-bleed reduction, and the single biggest quality difference in this system. Variance shadow
# maps leak light wherever the caster floats well above what it shadows - which is exactly a tree
# canopy over ground, where vanilla leaks around 20% of full sunlight and turns a tree's shadow
# into a faint grey wash. Raising this removes the leak, but every value below this cutoff becomes
# a HARD 0 rather than just dimmed - so it is more aggressive than it looks. 0.35 read as "shadows
# are too dark" in testing; 0.1-0.2 is the typical range for this technique. 0 reproduces vanilla's
# bleeding exactly. Raise gradually if canopy shadows still look washed out - edges start eating
# genuine penumbra and everything reads as flat/hard well before 0.35.
#sunShadowBleedReduction=0.15

# Radius, in near-cascade texels, of the 4-tap softening cross used on the near cascade. At 171
# texels per tile a single tap makes the shadow map's own texel grid visible along edges. 0 turns
# the extra taps off.
#sunShadowNearSoftness=1.0

# Overall strength of the blended shadow term. 1.0 = full, lower lifts shadows toward unshadowed.
# This is separate from shadowDarkness below, which controls how much AMBIENT light survives in
# shadow rather than how strong the shadow itself is.
#sunShadowStrength=1.0

# Snaps each cascade to its own texel grid and orients it by the sun instead of by your camera. At
# the near cascade's texel density, letting the shadow box follow your exact position and view
# direction makes every shadow edge crawl and shimmer as you walk or turn - far more distracting
# than the sharpness is worth. This also centres the near cascade ON you instead of ahead of you,
# which is what makes "the tiles around you" behave as a radius. Only turn off to compare.
#useSunShadowStabilisation=true

# Performance: re-render the mid / far sun shadow cascade only every Nth frame (1 = every frame). They start
# well away from you, so the difference can't be seen; sun movement and teleports still refresh them at once.
sunShadowMidUpdateInterval=3
sunShadowFarUpdateInterval=6

# Primitive capacity for the mid and far cascades' shadow queues. Too small and casters are dropped
# silently, and the ones dropped are the most distant - which looks like the far cascade simply
# stopping at some radius.
#sunShadowQueueSize=32768

# Lets the flat billboard trees rendered past the pretty-tree ring cast shadows into the far
# cascade. Off by default: a billboard is a single flat card, not real tree volume, so its
# "shadow" is only that card's silhouette - not worth submitting every distant tree into an extra
# shadow pass every frame for. Vanilla never shadowed billboards at all either. Turning this off
# also skips loading its shadow material entirely, so it costs nothing when off.
#useDistantTreeShadows=false

# Mountains and hills cast sun shadows onto the terrain over the whole map, at any distance - valleys go dark behind ridges at sunset and distant terrain is no longer lit through the hills in front of it. Computed in the background from the terrain heights, so it costs almost no FPS. Needs useSunShadowCascades.
#useTerrainShadows=true
# How dark terrain shadows get, 0..1.
#terrainShadowStrength=1.0
# Softness of terrain shadow edges, in degrees. Shadows from far-away ridges get softer, like real ones.
#terrainShadowPenumbraDegrees=0.8
# Raise if bumpy ground shows blotchy dark patches at low sun; lower if thin shadows fade out.
#terrainShadowBias=0.2

# Sun shadows of the distant billboard forest: every billboard tree within range casts a shadow shaped like the tree (firs a cone, oaks a round crown, bare winter trees almost nothing) onto the ground and onto neighbouring trees, so a distant forest no longer stands fully lit. Computed in the background like the terrain shadows, so it costs almost no FPS. Needs useSunShadowCascades.
useForestShadows=false
# Range of the forest shadows around you, in tiles (at most 250). They fade out over the last 30 tiles.
#forestShadowDistance=250
# How dark forest shadows get, 0..1.
#forestShadowStrength=1.0
# How much a forest darkens what stands under and inside its canopy, whatever the sun does, 0..1. Keeps forests reading as shaded at noon, when tree shadows fall straight under the crowns. Treetops stay bright.
#forestOcclusionStrength=0.5

# Fallback caster cell distance, used only for a shadow pass that cannot be attributed to a
# cascade; the per-cascade values above are what normally apply.
#shadowCasterCellDistance=9

# Forces shadows on regardless of vanilla's "Shadow Detail" setting.
#useShadows=true
# Forces pretty trees to cast shadows regardless of vanilla's "Shadow Detail" setting.
#useTreeShadows=true
# How much extra darkening shadowed areas get beyond vanilla (vanilla leaves ambient light fully
# unscaled in shadow, which is why shadows can look weak). 0 = vanilla, 1 = full shadow goes pitch
# black. Lowered from 0.6 as part of the sun-shadow rework: the new cascades are much sharper and
# explicitly correct for light bleeding, so a dense tree canopy now genuinely reaches shadow=0
# over a wide area, and 0.6 read as "darkest night" under trees. 0.25 was still a bit too dark, then
# 0.15 was reported still too dark under trees specifically - down to 0.08 (ambient floor 0.92).
# Raise only in small steps if shade needs more punch.
#shadowDarkness=0.08

# Real shadows cast by point lights (lamps, lanterns, campfires, torches, the player's own light): each
# shadowed light renders a soft cube shadow map from the light's position. Needs useSunShadowCascades=true.
#usePointLightShadows=true
# Most lights that cast shadows at the same time (1-8). Towns with many lamps pick the brightest/closest ones;
# the rest light normally without shadows, so a light-heavy town cannot exhaust the client.
pointShadowMaxLights=4
# Only lights within this many metres of the player cast shadows; shadows fade out over the last quarter.
#pointShadowDistance=60.0
# Resolution of each cube face (256, 512 or 1024). Higher = sharper shadows, more GPU memory.
#pointShadowResolution=512
# Most cube faces re-rendered per frame (1-24). A moving light needs 6; this is the main FPS budget knob.
pointShadowFacesPerFrame=4
# Seconds between refreshes of an unchanged face of the STATIC shadow layer (buildings, fences, trees, items).
#pointShadowRefreshSeconds=3.0
# Players, creatures, carts and opening gates go into a separate shadow layer re-rendered every frame, so their
# shadows follow every step and animation with no delay. Turn off to save FPS in very crowded towns.
#pointShadowDynamicCasters=true
# How dark point-light shadows are (0-1).
#pointShadowStrength=1.0
# Shadow edge softness in shadow-map texels (0 = hard).
#pointShadowSoftness=1.5
# Cuts light bleeding where shadows overlap (0-0.9). Higher = darker, crisper overlaps.
#pointShadowBleedReduction=0.3
# Point-light falloff shape: a bright core that fades naturally (windowed inverse-square) instead of vanilla's flat
# wide disk. Higher = more concentrated pools of light, darker toward the edge. 0 = vanilla falloff.
#pointLightFalloff=6.0
# Brightness multiplier for all point lights (lamps, campfires, torches, the player's light). 1.0 = unchanged.
#pointLightIntensity=1.7
# Stops many lamps/fires close together from adding up into a blinding white area. Where lights overlap,
# the brightest one stays exactly as it is and the others can only add a limited amount on top.
#usePointLightStackLimit=true
# How much overlapping lights may add on top of the brightest one, as a fraction of it. 0.5 = any number of lamps
# together is at most ~1.5x as bright as one lamp. Lower = flatter, higher = more build-up. 0 = almost none.
#pointLightStackLimit=0.5
# Small extra allowance so a cluster of faint lights (candles) still adds up a little. 0 = off.
#pointLightStackFloor=0.15

# Dims direct sunlight on the ground under cloud cover, beyond vanilla's own mild dimming.
#useCloudShadows=true
# How strongly cloud cover dims direct sunlight.
#cloudShadowIntensity=0.75
# Floor on how dark direct sunlight can get under full cloud cover.
#cloudShadowMinBrightness=0.25

# Makes a clear midday feel sunny: warmer, brighter sunlight and a less blue sky fill around noon in good weather. Fades out with clouds, rain and fog, and does nothing in the morning or evening.
#useSunnyNoon=true
# Extra direct-sunlight brightness at a clear noon (0.15 = +15%).
#sunnyNoonBrightness=0.15
# How warm (golden) the clear-noon light gets. 0 = vanilla's neutral white sun.
#sunnyNoonWarmth=1.1
# How much cast shadows themselves (not just light brightness) fade under cloud cover, 0 (no
# effect) to 1 (shadows disappear entirely at 100% cloud cover). Requires useSunShadowCascades,
# whose shader edits declare the uniform this is bound through.
#cloudShadowFadeStrength=1.0

# Dims ambient light in winter so snow's high reflectivity doesn't read as overexposed.
#useWinterDimming=true
# How strongly ambient light is cut in winter.
#winterAmbientIntensity=0.6
# Floor on how dark winter ambient light can get.
#winterAmbientMinBrightness=0.35

# Deep snow in winter: the snow on the ground has real depth near you. Players, creatures and carts sink into it and leave
# footprints, hoof prints and wheel ruts behind on soft ground (with a small rim of pushed-up snow; on paved
# roads, planks, gravel and packed dirt only very light prints in the thin snow layer), grass is half buried and flattened
# where someone walked, the snow surface has soft wind drifts and glitters in sun and moon light. Footprints slowly
# fill in again, faster while it snows. Needs useTerrainPOM (off in the Low preset).
#useDeepSnow=true
# How deep the snow is, in metres - how far feet sink in and how deep the footprints get. 0.02 to 0.3.
#snowDepth=0.1
# Players, creatures and carts leave tracks in the snow.
#snowFootprints=true
# Minutes until a footprint has filled in again (it fades during the last half of that time, faster while it snows).
#snowFootprintLifetime=20.0
# Footprints are drawn up to this distance from the camera, in metres. 4 to 26.
#snowFootprintRange=24.0
# Players, creatures and carts stand in the snow (their feet sink in by snowDepth) instead of on top of it.
#snowSinkCreatures=true
# Snow on hard ground (paved roads, planks, gravel, packed dirt) as a share of snowDepth: footprints there only press
# into this thin layer of snow, never into the stone or wood itself. 0 = no prints on hard ground, 0.35 = maximum.
#snowOnPavement=0.12
# Strength of the soft wind-blown waves on the snow surface (0 = flat snow).
#snowDrifts=1.0
# Strength of the glittering snow crystals in sun and moon light (0 = off, 1.2 = maximum).
#snowSparkle=1.0
# Winter only: how much of the ground's normal reflections stays (1 = unchanged, 0.5 = half). Snow-covered ground
# was getting very bright from them.
#winterTerrainReflection=0.15
# Winter only: strength of direct sun (and moon) light (1 = unchanged). Snow reflects so much light that full
# sunlight makes the ground glare.
#winterSunIntensity=0.8
# Winter only: how much of the sun light's warm yellow tint is replaced by a neutral, slightly cool white (0 = game's
# own colour, 1 = fully neutral). Brightness stays the same.
#winterSunNeutral=0.7

# Winter: snow lies on roofs, wall tops, fences, bridges, decorations, items on the ground and parked carts and boats.
# Flat tops are fully white, pitched roofs mostly white with the shingles or planks showing in the grooves, steep faces
# only hold snow on ledges. Never on creatures, players or what they wear and carry, and never under roofs, floors,
# bridges or underground.
#useWinterCover=true
# How much snow lies on buildings and objects (0 = none, 1 = full).
#winterCoverStrength=1.0
# Winter: shade turns cool blue (snow in shadow reads blue) and colours get slightly calmer; sunlit areas, lamps and
# fire keep their colour.
#useWinterGrade=true
# How blue the shade gets in winter (0 = unchanged, 1 = strongly blue).
#winterShadeCool=0.45
# Colour saturation of daylight in winter (1 = unchanged, 0.88 = 12% calmer).
#winterSaturation=0.88
# Winter weather moods: clear days are crisp with less haze, overcast days milky and soft, falling snow adds a pale
# haze (you can always see at least 300-400 m) and on calm mornings and evenings a cold haze settles in the valleys.
#useWinterWeather=true
# Strength of the cold valley haze at dawn and dusk (0 = off).
#winterValleyHaze=1.0
# Winter only: brightness of white snow on the ground (1 = the game's own snow texture).
#winterSnowBrightness=0.92

# Gives distant/flat tree billboards a fake 3D shading gradient instead of one flat lit plane.
#useBillboardTreeShading=true

# How far a billboard tree's crown-shaped shading normal leans toward straight up - 0 uses the crown shape as-is (sides turn toward or away from the sun), 1 shades every card as if it faced the sky. Higher reads as a softer, more uniformly sunlit canopy.
#impostorDomeBlend=0.3
# Billboard trees are lit mostly by sky light: this multiplies the game's ambient light on them by day (fades back to 1x at night, so night trees stay dark). Raise it if trees in shade or seen from their unlit side are still too dark.
#impostorAmbientBoost=1.9
# How much direct sunlight is added on top of the sky light. 0 = sky light only, 1 = full hard-surface sun. Lower makes the sun matter less.
#impostorSunStrength=0.8
# How much the sun's angle matters, 0..1. 0 = every tree gets the same sun whichever way it faces; 1 = the side facing away from the sun gets none.
#impostorSunDirectionality=0.7
# Share of the sunlight that still reaches billboard trees in shadow (blocked by terrain, buildings, other trees, or their own leaves). 0 = shaded trees get sky light only.
#impostorShadeLight=0.25
# Overall brightness of billboard trees. Scales the game's real sun and sky light, never adds light of its own, so trees still go dark at night. Raise if billboard trees read darker than the real trees next to them, lower if they glow.
#impostorBrightness=1.2
# Sunlight glowing through billboard tree canopies when you look toward a low sun (golden-hour rim light). 0 disables it.
#impostorTranslucency=0.6
# Smoothly dissolves real 3D trees into billboard trees (and back) over a band around you, tree by tree, instead of whole 16x16-tile squares swapping at once.
#useTreeCrossfade=true
# Width of that dissolve band, in tiles. Wider hides the switch better but costs a little more.
#treeCrossfadeWidth=8.0
# Lights the leaves of nearby 3D trees like a real crown: crown-shaped shading, self-shadowing baked from the real tree models (or estimated until the bake is done), soft sky light and sun glowing through the leaves - the same foliage lighting the billboard trees use, so both look alike.
#use3DCanopyLighting=true
# Lets the leaves of nearby 3D trees flutter slightly in the wind.
#treeLeafFlutter=true
# How far the leaves of 3D trees rustle, in metres at the outer crown (60% of this in calm air up to 140% in strong wind). The whole-tree sway is the game's own and unaffected.
#treeLeafFlutterStrength=0.02
# Keeps billboard leaf edges from crawling/flickering while the camera moves.
#useStableTreeDither=true
# Baked angles per billboard tree, 8 or 16. 16 turns more smoothly as you walk around. Changing it rebakes the tree textures once.
#impostorViews=16
# Bakes billboard shading detail (normals and self-shadowing) at full resolution. Changing it rebakes the tree textures once.
#impostorFullResMaps=true
# Stores the billboard tree textures GPU-compressed (about 4x less video memory, tiny quality loss).
#impostorCompressAtlas=true
# Gives each billboard tree a slightly different shade so forests don't look copy-pasted.
#useTreeColorVariety=true
# How strong that variation is. 1 is subtle, 2 is clearly visible.
#treeColorVariety=1.0

# Enables an extra ring of billboard trees/bushes far beyond vanilla's own render distance.
#useDistantTrees=true
# How far, in tiles, that distant tree ring extends (set by qualityPreset: 1500 on Ultra/High, 1050 on Medium, 600 on Low).
#distantTreeRenderDistance=1500
# Distance, in tiles, out to which distant trees keep their full density. Beyond it the share of trees falls with distance (see distantTreeThinExponent): trees fade out one by one and the rest keep their real size. Far cells are rebuilt without the thinned-out trees, so the longer ring costs less than the shorter, denser one did. Set by qualityPreset: 240 on Ultra/High, 160 on Medium, 85 on Low.
#distantTreeThinStart=240
# How steeply the share of distant trees falls beyond distantTreeThinStart: 3 = twice the distance keeps an eighth of the trees, 2 = a quarter. Higher is cheaper and sparser far away (1-6).
#distantTreeThinExponent=3.0
# The lowest share of trees kept at any distance (0.05 = 1 in 20). Higher fills the far hills with more trees at more GPU cost. 1 disables the thinning. Set by qualityPreset: 0.06 on Ultra/High, 0.04 on Medium, 0.02 on Low.
#distantTreeFarDensity=0.06
# How far, in tiles, billboard trees show up in water reflections. 0 = the whole distant tree range. Lower if reflections cost too much frame time.
distantTreeReflectionDistance=30
# Billboard trees show in water reflections even with the game's Reflections option on the level that normally
# leaves trees out. Only the cheap billboard cards are reflected (no 3D tree models), out to distantTreeReflectionDistance.
#useBillboardTreeReflections=true

# Distant buildings, roofs, bridges and fences beyond the game's own structure range, drawn as lightweight low-poly
# proxies with procedural windows (lit at night), masonry, planks and roof tiles. Needs the DistantTerrainRefinement
# server mod on the server and useDistantTerrainRefinement=true here (it shares that connection); on a server without it nothing changes.
#useDistantStructures=true
# How far, in tiles, distant structures and big items are drawn. Nothing beyond this is drawn (the server sends up to 250).
#distantStructureDistance=250
# How far, in tiles, distant fences, walls and hedges are drawn. They are thin and numerous, so they stop sooner than buildings.
#distantStructureFenceDistance=160
# Hard cap on distant structure pieces (walls, roof tiles, bridge spans, fence segments) drawn at once, nearest first.
# Keeps big cities from costing too much frame time; lower it on a weak GPU.
#distantStructureMaxElements=40000
# Big landmark items (colossi, guard and archery towers, large ships, portals and obelisks, rift objects, trebuchets)
# drawn beyond the normal item range, using each model's lowest-detail version. Only these huge items are sent.
#useDistantItems=true
# Most distant big items drawn at once; the biggest and nearest win. Lower it on a weak GPU.
#distantItemMaxCount=32

# Smoother distant hills: 2x2-tile height detail near you and 8x8 further out, instead of vanilla's blocky 16x16.
# Only works on a server running the companion DistantTerrainRefinement server mod, and only with Extended View
# (render distant terrain) on. On other servers it does nothing except build the distant terrain mesh finer -
# turn it off there to get vanilla's distant mesh back exactly.
#useDistantTerrainRefinement=true
# Sharp distant ground: past sharpGroundStartDistance the ground is drawn from the real tile textures tile by tile, instead of the low-resolution picture the game paints for each terrain ring. Roads, sand, steppe, tundra and every other ground type stay crisp and in their own look out to the horizon, and nothing slides around while you walk. Uses the exact tiles the game knows around you; with the DistantTerrainRefinement server mod also the exact tiles out to about 500 tiles and its 2x2 / 8x8 data beyond.
#useSharpDistantGround=true
# Distance in metres where the sharp ground starts fading in, and where it is fully in.
#sharpGroundStartDistance=40.0
#sharpGroundFullDistance=90.0
# Resolution of each ground texture in pixels (256 or 512; 512 costs about 4x the video memory, roughly 100 MB).
sharpGroundTextureSize=256
# How much of the grass texture's own detail shows through the meadow colour on distant grass (0 = flat meadow colour, 1 = full).
#sharpGroundGrassDetail=0.6
# How soft and irregular the edges between ground types are (0 = straight tile edges, 1 = default, natural).
#sharpGroundOrganicEdges=1.0
# Large-scale brightness variation that keeps wide fields from looking tiled (0 = off).
#sharpGroundVariation=0.12
# Very far grass and lawn is coloured in large soft patches from deep green to fresh green to yellowish, like real meadows seen from afar (0 = off, 1 = default). Fades in from sharpGroundFarGrassStart metres and is full from sharpGroundFarGrassFull metres, so nearby grass keeps its own colour.
#sharpGroundFarGrassVariation=1.0
#sharpGroundFarGrassStart=300.0
#sharpGroundFarGrassFull=700.0

# Dyed barding, saddles, bridles and saddle bags keep their dye colour while equipped on a horse (vanilla only shows
# the colour on the ground). The game never sends that colour, so this needs the DistantTerrainRefinement server mod.
#useMountItemColors=true

# Creature colours set by the server (DistantTerrainRefinement server mod) are drawn exactly as set.
# Without this, or on a vanilla client, they still show, just slightly washed out by the game's own tint formula.
#useCreatureColors=true

# Spirit guards and other ghosts get a spectral look: a soft pale rim, a faint see-through body that keeps the
# shape of the model, faint wisps flowing up through it, a gentle pulse and feet that dissolve into mist - instead of
# the game's patchy grey see-through model.
#useSpiritFX=true

# Smoke, dust, sparks, magic and every other particle effect get a modern renderer: soft edges where they touch the
# ground or walls, real sun/moon lighting on smoke and dust (brighter toward the sun), a fade instead of a screen-filling
# sprite when one passes the camera, correct back-to-front layering between effects, and the game's swapped green/blue
# colours on effect particles fixed. Blood, dust, smoke and every other non-glowing particle is lit by the scene instead of
# glowing at night. Rift plant smoke becomes a slowly swirling dusky haze, wraith smoke dark curling tendrils, tree and stone
# dust soft billows instead of hole-riddled blotches, smoke and fog get self-shading and a silver edge toward the sun, and
# fountain spray gets a sun glint.
#useParticleFX=true

# Vanilla keeps playing surface ambient sounds (birds, frogs, wolves, water) underground when you log in inside a cave,
# and keeps the nearest one playing after you walk into a cave. This switches them to cave sounds.
#useCaveAmbientFix=true

# White, grey, black and very light dyes show their real colour on walls, fences, items, worn and wielded gear, mount
# gear, carts, wagons, ships and server-coloured creatures. The game only multiplies the texture by the dye, so white looked like no dye at
# all (walls even got darker) and black only made the texture a bit darker. Colours whose darkest channel reaches the
# threshold (0-1) switch to the dye's own colour, fading in over the 0.15 below it; so do greys of any brightness
# whose channels differ by at most greyChroma (fading out at twice that). Brightness is how bright pure white ends up
# (0-1, black is always near-black), detail how much of the texture's shading stays visible (0 = flat paint,
# 1 = full texture detail), specular how much of the surface shine is kept on painted parts (paint is matte;
# 1 = as shiny as the bare texture).
#useTrueWhiteDye=true
#trueWhiteDyeThreshold=0.6
#trueWhiteDyeBrightness=0.55
#trueWhiteDyeDetail=0.7
#trueWhiteDyeSpecular=0.3
#trueWhiteDyeGreyChroma=0.06

# Trees only (never bushes): replaces the crude vanilla distant-tree atlas with a real-mesh-baked
# albedo+normal atlas (real per-tree normal maps, dynamically relit) baked once per season on
# first use and cached to disk under mods/distantTreeBakeCache/. First-ever launch briefly pauses
# to bake; every launch after loads the cache instantly. A bad bake/shader load falls back to the
# vanilla atlas automatically.
#useBakedDistantTrees=true
# Makes billboard trees sway in the wind. Off keeps billboards perfectly still (the real 3D trees near you still sway either way).
#useDistantTreeWind=false
# Sway amplitude, in world units, at the very top of a canopy.
#treeWindStrength=0.15
# Speed of the wind sway animation.
#treeWindSpeed=1.0

# Widens the radius around the player that renders scattered tile props like rocks and crops.
#useWiderDecorations=true
# Radius, in tiles, of that wider decoration scatter.
#decorationRadius=14

# Replaces the flat grass sprites with a real field of thin 3D grass blades: dense tufts that curve and taper to a point, dark at the root and bright at the tip, swaying in rolling waves of wind and bending away as you walk through. Covers grass, lawn, the grass under trees and bushes, steppe, tundra, marsh, mycelium and enchanted grass, in each season's colours. Flowers grow only on the tiles that really have them (the ones you can pick), in their real colours. Needs the deferred renderer; falls back to vanilla grass without it.
#useStylizedGrass=true
# How bright flowers are at night under moon and sky light, compared with daytime colours (1 = no change). Lamps, torches and other point lights still show them in full colour.
#flowerNightBrightness=0.3
# Blades per square metre close to you. Higher = lusher but heavier on the GPU.
grassDensity=80
# Blade width at the root, in metres (0.013 = 1.3 cm).
#grassBladeWidth=0.013
# Multiplies every grass height.
#grassHeightScale=1.0
# How far away grass is drawn, in metres (up to 660). Distant grass is thinned out smoothly, so far grass stays cheap. Past about 480 metres it needs the DistantTerrainRefinement server mod.
#grassRenderDistance=640.0
# Grass is drawn at full density up to this distance in metres, then thins out with distance.
#grassFullDensityRadius=12.0
# How strongly the grass reacts to the game's wind.
#grassWindStrength=1.0
# Gentle breeze the grass always has, even on a calm day.
#grassIdleWind=0.12
# How many flowers grow on flower tiles (0 = no flowers drawn).
#grassFlowerDensity=1.0
# Brightness of the grass colours.
#grassBrightness=1.0
# Calms the shimmer of thousands of thin moving blades: each frame the grass is blended with where it was a moment ago (camera motion is followed exactly, colours are clamped so nothing smears or ghosts). Only grass pixels are touched, everything else stays as sharp as before.
#useGrassTemporalSmoothing=true
# How strongly grass is smoothed over time (0 = off, 0.5 = default, higher = calmer but softer).
#grassTemporalStrength=0.5
# Grass and flowers bend away around you and around every creature, horse and other player standing or walking in them, in an oval about the size of the body that stretches a little behind while moving. Off = the old simple bend around the player only.
#useGrassTrample=true
# How far the grass bends away (0 = not at all, 1 = default, higher = flatter).
#grassTrampleStrength=1.0
# Distance in metres around you within which creatures, horses and other players bend the grass (40 = 10 tiles).
#grassTrampleRange=40.0
# Infinite grass: beyond the grass blades the terrain itself is shaded as a grass meadow (same colours, wind waves and lighting as the blades), all the way to the horizon, so distant hills stay green and grassy instead of showing bare ground. The ground close to you is never touched. Always off while useSharpDistantGround is on, which draws the real ground textures out there instead.
#useGrassGroundBlend=true
# How strongly the ground takes on the grass colour (0 = off, 1 = default).
#grassGroundBlendStrength=1.0
# How strongly the grass blades take on the colour of the ground they grow on (0 = fixed grass palette, 1 = default). The colour is measured from the game's own ground texture for the current season, so autumn, winter and season mods (e.g. NoWinter) are followed automatically.
#grassGroundColorMatch=1.0
# Distant meadows are mottled with tufts, clumps and drifts of lighter and darker growth, on the blades and the ground under them, so the middle distance does not turn into one smooth colour (0 = off, 1 = default, higher = stronger).
#grassMeadowDetail=1.0
# Beyond 32 metres the same grass blades are drawn by a GPU-instanced far field (a handful of draw calls instead of hundreds), so the meadow continues seamlessly out to grassRenderDistance. Off = the close-up grass patches cover the whole range instead (much heavier on the CPU).
#useGrassFarField=true

# Keeps the game window that opens at startup. Without this the game closes its window once loading finishes and opens a new one (it re-applies the screen settings it already used), which flashes the screen and loses window focus.
#fixDoubleGameWindow=true
# Fixes the long pause (often 10 seconds or more) before the launcher appears, and the startup crash "Error getting display info" on some multi-monitor, HDR or DisplayLink setups. Both come from the way the game asks for the list of screen resolutions. You still get the full list of resolutions and refresh rates.
#fixDisplayModes=true
# Gives the right-click menus a new look: a dark panel with a gold accent, a header with the name of what you clicked, smooth hover highlights, key shortcuts shown as keycaps, submenus that open right next to their entry, and an animated bar while the server's list of actions is loading. The menu opens exactly at the mouse instead of at a random spot near it. With useDefaultActions on, every action in the menu of something in the world has a star: click it to make that action what E does for this kind of thing (every oak tree, every large chest, every horse...), click it again to go back to the automatic choice. A dim star marks what E does automatically. Only one star per kind of thing; your stars are saved on this PC in mods/skloGraphics/defaultActions.properties ("default_action clear" in the console forgets them all).
#useModernMenus=true
# Replaces the plain box that names what is under the mouse (items, creatures, trees, tiles, inventory rows...) with a card in the same style as the right-click menus: the name as a gold header, the details below it, a smooth fade-in and a spot next to the cursor that never runs off the screen. With useDefaultActions and useRepeatAction on, what E and R would do is shown inside this card (key, action, tool) instead of in separate boxes above the cursor. R is only listed when it can really be done on what you point at: in reach, with the tool still in your inventory, and offered by the server for that target. In mouse-look the E/R prompts stay in the middle of the screen as before.
useHoverCard=false
# Gives the chat and event windows a new look (dark panel with a gold accent, equal-width rounded tabs on a recessed tab rail, a slim scroll bar, a roomy input box that shows which channel you are typing to) and lets you drag their tabs around like in a web browser: drag a tab along the tab row to reorder it, drop it on another chat window to move it there, or drop it anywhere else on the screen to open it in a window of its own. Every chat window you make has its own input line that types into the tab shown there. Tabs with unread messages glow gold, closeable tabs have their own x. Right-click a tab for "Move to new window", "Move back" and "Reset chat layout". Where you put your tabs and your extra windows is remembered on this PC in mods/skloGraphics/chatLayout.properties. Respects the game's GUI opacity setting. Set to false to get the game's own chat and event windows back (no restyle, no tab dragging).
#useModernChat=true
# Replaces the health and stamina bar with a compact one the same size as before: one bar shows both: stamina fills green from the left, lost health fills red from the right (your stamina can never reach past your health), and the dark gap between is spent stamina, with thin bars below for water, food (its colour shows nutrition: orange at 0%, dark green at 100%), the four CCFP values, sleep bonus (grey while frozen) and favor for priests. Hover over it for the exact numbers. Lost health briefly shows as a fading trail, and the bar pulses red when you are below a quarter health. Name, FPS, speed and sleep bonus can still be toggled with a right-click like before. Set to false for the game's own bar.
#useModernHealthBar=true
# Puts a search bar at the top of your inventory and of every container window (chests, crates, bags, piles, carts...). Just click it and type: the list filters while you type, no button to press. Several words narrow it down (all of them must be in the name, in any order, e.g. "iron lump"). Matching letters are highlighted, the number of matching items is shown on the right, and the containers holding matches open by themselves so you see where everything is. Closed containers are looked into too: their contents are loaded from the server in the background while you search. Esc or the x clears the search, Enter keeps the filter and gives the keyboard back to the game.
#useInventorySearch=true
# Takes the resolution list from Windows, which is fast. Set to false to ask the graphics driver first, the way the game normally does (slow); the other source is still used if the first one returns nothing.
#displayModesFromDesktop=true
# Widens the radius around the player that renders grass-blade sprites (vanilla sprites are still used for reeds, kelp, crops and the like).
#useWiderGrass=true
# Radius, in tiles, of that wider grass rendering.
#grassChunkRadius=30
# Raises how often a flowering tile actually shows its flower sprite.
#useMoreFlowers=true

# Keeps grass/lawn/field decorations gently swaying even in dead-calm air (vanilla freezes them completely at zero wind).
#useGrassIdleWind=true
# Minimum per-axis wind sway (in windForce units) so grass never freezes at any wind direction or in dead calm. Higher = more visible idle waving. Real winds already stronger than this on an axis are unaffected.
#grassIdleWindStrength=0.35

# Replaces vanilla's water shader with a custom one: depth-based color gradient, boosted fresnel reflections, layered wave detail, and foam.
#useEnhancedWater=true
# Raindrops make expanding ripple rings on water (lakes, rivers, sea) while it rains, starting where each rain splash lands. More of them the harder it rains, and plenty already in light rain. Needs useEnhancedWater.
#useWaterRainRipples=true
# How strongly the rings ripple the water surface and its reflection. Much above 2 turns reflections to noise in heavy rain.
#waterRainRippleStrength=1.0
# Water at the shoreline follows the real fine relief of the ground: on cobblestone it fills the joints between the stones before it covers the stones, on dirt the small holes and low spots first. Also leaves a darker wet band just above the waterline. Needs useEnhancedWater; the fine relief needs useTerrainPOM and useWetGround.
#useWaterShoreRelief=true
# How far from you (in tiles) the shoreline follows the ground relief and curves naturally. Beyond this the waterline is the plain terrain edge.
#waterShoreRadiusTiles=24.0
# Height in metres of the wet band above the waterline.
waterShoreWetHeight=0.15
# How much darker the wet band is (0 = not at all, 1 = black).
waterShoreWetDarkening=0.45
# How strongly the waterline meanders. The water level is compared against the ground plus a fine natural height variation (scaled with the slope), so the shore curves like a real one: wide bays and tongues on flat beaches, tighter wiggles on steep banks, always filling the low parts of a tile first. 0 = the plain terrain edge.
#waterShoreMeander=1.6
# Swimming creatures (and you) leave AAA-style water wakes: rings spreading from the body, a V-shaped wake behind anyone swimming, and white foam churning at the waterline and behind them. Needs useEnhancedWater.
#useSwimWakes=true
# Water inside caves looks like cave water: it reflects the cave ceiling, walls and torches around it instead of the outdoor sky, stays dark and calm, and has no sun glints, rain rings or whitecaps. Water seen outdoors through a cave entrance keeps its normal look.
#useCaveWater=true
# Cave walls, ceilings and floors look like real rough stone: no shine, no mirror reflections and no torch glints on the rock.
#useMatteCaveStone=true
# Cave ceilings and walls just below the ground stay as dark as the rest of the cave instead of glowing with daylight or moonlight from the surface above.
#useSharpCaveOcclusion=true
# The black wall where the cave stops being drawn closes off properly: no more bright slits of sky between it and the cave ceiling or floor.
#sealCaveRenderEdge=true
# See much farther in caves: tunnels, halls and mines are drawn up to caveViewDistance tiles away instead of the vanilla 24, fading smoothly into darkness at the edge. Only underground - on the surface caves stay at the vanilla distance. Needs the DistantTerrainRefinement server mod; on other servers caves look vanilla.
#useFarCaves=true
# How far you can see in caves, in tiles (32-96, vanilla is 24). The quality preset picks 96 (Ultra), 80 (High), 64 (Medium) or 48 (Low); set it here to override.
#caveViewDistance=96
# The far cave edge fades into darkness instead of ending at a hard black wall.
#caveDistanceFade=true
# Pictures in server windows can come from https:// addresses too, animated GIFs play, and servers can show YouTube videos (with sound) or video files.
#useWebMedia=true
# Turn off to never play videos in server windows (pictures and GIFs still work).
#useWebVideo=true
# The first time a server shows a video, the video player (ffmpeg, plus yt-dlp and deno for YouTube, about 175 MB) is downloaded once into mods/skloGraphics.
#webVideoAutoInstall=true
# Loudness of video sound, 0 (mute) to 1.
#webVideoVolume=0.8
# Video quality: 360, 480, 720 or 1080. Higher looks sharper in big windows but costs more CPU.
#webVideoMaxHeight=480
# Head bobbing (the camera following the walk animation) is switched off once for every player. Anyone who wants it back can tick "Enable Head Bob" in the game settings and it stays on.
#disableHeadBobByDefault=true
# Third person view: the camera sits behind your character and follows your view, moving in close instead of going through the ground or cave walls. Third person is the default view; the CHANGE_VIEW key (V by default, Wurm's center view moves to a free key) switches between first and third person. The game's own "Third Person View" option works too.
#useThirdPersonCamera=true
# Distance of the third person camera behind your head, in metres.
#thirdPersonDistance=3.5
# How far the third person camera sits above your head, in metres.
#thirdPersonHeight=0.35
# Sideways over-the-shoulder offset in metres (positive = camera to the right, 0 = centred behind you).
#thirdPersonShoulder=0.0
# Mouse wheel zoom for the third person camera: scroll over the world (not over a window) to move the camera closer or further. These set the closest and furthest distance in metres; thirdPersonDistance above is where it starts.
#thirdPersonMinDistance=1.5
#thirdPersonMaxDistance=6.0
# How many metres one wheel notch moves the camera.
#thirdPersonZoomStep=0.5

# Livelier, smoother animation for players, people and animals, on top of the game's own animations. Turn off to get the game's animations exactly as they were.
#useAnimationRig=true
# Legs walk where the character actually goes while the chest and head keep facing where they look - no more moonwalking when someone walks sideways or backwards, and steps match the ground speed.
#animLegSteering=true
# Standing still, the feet stay planted while chest, neck and head follow the view, up to looking back over the shoulder; the body itself never turns until you walk off (or steps round in combat and during actions).
#animTurnInPlace=true
# Animals and other creatures turn smoothly towards where they walk instead of sliding sideways through turns, and four-legged animals bend their body into a turn.
#animCreatureFacing=true
# In third person your head looks up and down with the camera; animals and people nearby glance at you now and then.
#animHeadLook=true
# Feet stand on slopes and steps instead of floating above or sinking into the ground.
#animFootIK=true
# Bodies lean into turns and when speeding up or slowing down.
#animLean=true
# Creatures flinch when they are hit.
#animHitReactions=true
# In third person your own character uses the same animations everyone else sees, instead of the first-person ones made for looking down at your own body.
#animThirdPersonBody=true
# Seconds it takes to blend from one animation into the next (walk to run, idle to attack, ...). The game used 0.2.
#animBlendTime=0.3
# Seconds it takes to blend into and out of walking, running and swimming. Keep this short: while the walk is still blending in, the feet slide.
#animMoveBlendTime=0.12
# Animals and people glance at you when you are closer than this many metres.
#animLookDistance=8.0
# Health bar over a creature or player while your mouse is on it, and over your combat target the whole fight while it is within 60 metres, even without hovering. Green is health left, red is damage taken, like your own health bar.
#useCreatureHealthBars=true
# What people say in local chat shows for a few seconds in a small dark bubble above their head (up to 40 metres away).
#useChatBubbles=true
# While you ride a horse or another creature, a panel under your own health bar shows its picture, name and health.
#useMountHealthPanel=true
# Default actions: point at something and a small prompt shows what E does (open a chest, cut down a tree, mine rock, dig, harvest, fish, butcher, lead...). E uses the item you have activated, or none if it is no use on the target, and never equips anything. The prompt appears instantly: the mod knows what fits trees (fruit, sprouts), fields (ripe, tended), grass, water, rock, caves, containers, corpses, carts, boats and animals by itself, and a server with the SkloGraphics server mod sends its own list and rules for every item and creature once when you log in. If an action isn't possible, the server says so. E replaces the old turn-right key once (DEFAULT_ACTION, rebind any time).
#useDefaultActions=true
# Repeat action: R does an action again on whatever you point at - an item in your inventory or a container window, or a tile, tree, rock, corpse, animal, wall, fence, floor or bridge in the world - the same way the server-side repeat works: the mod remembers your last action for each kind of target (ground, cave, items, creatures, walls...), so R on a tile (ground, tree, bush, field) repeats what you last did to a tile even if you did something to an item since. R uses the same tool as last time without changing what you hold, or the best other one of the same kind (no rarer than the original, a glowing one first if the original was glowing); if none is left that kind is forgotten. A prompt under the E prompt shows what R will do, and right-click menus get a "Repeat ..." entry. Examine, take, drop, open, build and the other one-off actions are never repeated. R becomes the repeat key once, on the first start with this feature (REPEAT_ACTION, rebind any time).
#useRepeatAction=true
# Tool menus: on a server with the SkloGraphics server mod, a right-click menu lists every action you could do on the target with anything you carry, not only with the item in your hand, each with the icon of the tool it needs. Clicking one activates that tool first (the one in your hand if it fits, otherwise the highest quality one you carry). Without the server mod menus stay as they are.
#useToolMenu=true
# Strength of those wakes and foam (0 = off, 1 = default, 2 = very splashy).
#swimWakeStrength=1.0
# Width of the water's planar reflection render target (height follows the screen's aspect ratio). Higher = sharper reflections, costs GPU time.
waterReflectionSize=1024
# Skips vanilla's own 2-pass Gaussian blur on the water reflection texture - the actual biggest
# source of blurry reflections, more than resolution. false restores vanilla's soft/blurred look.
useSharpWaterReflection=false
# Water reflections are a true planar mirror: every water pixel shows exactly the mirrored point of the scene above
# it, so reflections stay locked to what they mirror while you move, turn, swim or the waves roll. Waves and ripples
# only add a small, smooth, bounded tilt on top. The reflection camera is fitted to your screen (aspect + field of
# view) for about twice the detail, and also mirrors correctly when your eye is right at water level (vanilla stops
# at 0.5 m, which shifted reflections while swimming). Distant trees, distant items and distant structures are drawn
# into the reflection too. Needs useEnhancedWater.
#useFittedWaterReflections=true
# Water reflects everything - trees, items, creatures, houses, fences, distant objects - no matter which level the
# in-game Reflections option is on (the game defaults to "Sky & Terrain", which leaves all of those out). Only
# "Disabled" is still respected. false = gameWaterReflections decides, as in vanilla. On by default on Ultra and High.
#waterReflectEverything=true
# How much the big rolling waves tilt the mirror image. 0 = waves don't bend reflections at all.
#waterReflectionWaveStrength=0.08
# How much the small surface ripples wobble the mirror image. 0 = perfect glass mirror.
waterReflectionRippleStrength=0.07
# Micro-roughness of the water surface: how soft/vertically streaky reflections get, more so far away. 0 = razor sharp.
waterReflectionRoughness=0.004
# Minimum reflectivity looking straight down at the water (physical water is ~0.02). Higher = stronger reflections
# near you, lower = more of the seabed/water colour shows through.
waterReflectionFresnelMin=0.12
# Extra field of view rendered into the reflection beyond the screen's own, so wave-tilted lookups near the screen
# edge still find data. Higher = fewer edge gaps on rough water, lower = sharper reflections.
#waterReflectionFovMargin=1.2

# Makes ships/boats rock (roll+pitch) continuously, even moored or becalmed - vanilla's own roll
# animation is wind-driven and near-zero at calm wind, and never animates pitch at all.
#useShipBobbing=true
# Multiplier on the ship bobbing amplitude (base 7 degrees roll / 4 degrees pitch). Higher = more motion.
#shipBobbingStrength=0.65
# Keeps water out of ship/boat hulls: renders the real hull meshes into a depth mask from below each
# frame and removes the water surface only where it lies inside the hull, so it never shows through the deck.
#useShipHullWaterMask=true
# Debug: paints all water by why the hull mask kept it. Leave off for play.
#useShipHullMaskDebug=false

# Underwater view: waterline across the lens when waves reach the camera, underwater fog, caustics,
# light shafts, surface seen from below, and water running off the lens after surfacing. Needs usePostProcess.
#useUnderwaterEffect=true
# How murky the water is underwater. Higher = shorter visibility.
#underwaterFogDensity=1.0

# Spawns extra fireflies directly around the player instead of relying only on vanilla's rare per-tile spawns.
#useFireflies=true
# Per-tick chance of a new firefly spawning near the player.
#fireflySpawnChance=0.05
# Radius around the player fireflies spawn within.
#fireflyRadius=12.0
# Spawns extra butterflies directly around the player the same way.
#useBetterButterflies=true
# Per-tick chance of a new butterfly spawning near the player.
#butterflySpawnChance=0.05
# Radius around the player butterflies spawn within.
#butterflyRadius=12.0

# Spawns extra birds flying overhead near the player.
#useBetterBirds=true
# Per-tick chance of a new bird spawning.
#birdSpawnChance=0.04
# Share of birds left in winter (0 to 1): rarer and smaller flocks, lower bird cap.
#birdWinterAmount=0.1
# Closest horizontal distance from the player a bird can spawn.
#birdMinDistance=10.0
# Farthest horizontal distance from the player a bird can spawn.
#birdMaxDistance=130.0
# Lowest altitude a bird flies at, above the ground, trees and buildings below it.
#birdMinHeight=16.0
# Highest altitude a bird flies at, above the ground, trees and buildings below it.
#birdMaxHeight=55.0
# How high birds stay above the ground, hills, trees and buildings they fly over (applies to all birds, not just the extra ones). 0 lets them fly through terrain like vanilla.
#birdTerrainClearance=20.0
# In-game hour birds go to sleep: from then on no birds appear and the ones still flying fade away.
#birdRoostStartHour=19.0
# In-game hour birds wake up again (4.5 = 4:30). Set both hours the same to have birds around the clock.
#birdRoostEndHour=4.5
# Birds become real 3D animals instead of flat pictures: crows, gulls, buzzards and pigeons with feathered wings that flap, glide and fold, bank into turns, soar in circles and fly in flocks. Lit by the sun with glowing wing edges against the light. Needs the deferred renderer, otherwise the old sprites stay.
#use3DBirds=true
# Size of the 3D birds (1 = natural size; a little bigger reads better at a distance).
#birdScale=1.6
# Most birds alive around you at once.
#birdMaxCount=80
# Far-away birds are never drawn smaller than this many pixels across, so they don't flicker into nothing.
#birdMinPixels=4.0
# Birds farther away than this (metres from the camera) fade out smoothly and are not drawn, so they never shrink to flickering dots on the horizon. Birds that fly past it turn back towards you.
#birdViewDistance=170.0
# Now and then a lone gull dives down and skims low over open water, riding over the waves, then climbs back up. Only over water at least 2 m (20 dirt) deep all along its path, with nothing near it (no shore, bridge, boat, creature or player), one at a time.
#useBirdWaterSkims=true
# Average seconds between two water skims (randomly 40% shorter or longer).
#birdWaterSkimInterval=75.0

# Spawns a ground-hugging insect swarm near the player, any time of day.
#useInsects=true
# Per-tick chance of a new insect spawning.
#insectSpawnChance=0.05
# Radius around the player insects spawn within.
#insectRadius=5.0

# Honey bees fly around wild and kept bee hives that have bees in them ("active" or "noisy" hives): orientation loops in front of the entrance, foragers leaving and coming home with pollen on their legs, bees working the ground nearby and hovering before they crawl in. Noisy hives (about to swarm) are much busier. Bees stay in at night, in the rain and in winter. Needs the deferred renderer.
#useBees=true
# Bees per active hive (a noisy hive gets 1.8x as many).
#beeCount=60
# Most bees simulated around you at once, shared out evenly between the hives in range.
#beeMaxCount=1200
# Size of the bees (1 = natural size, about 13 mm; a little bigger reads better).
#beeScale=1.5
# Far-away bees are drawn at least this many pixels across (up to 5x their size), so a swarm stays visible as specks.
#beeMinPixels=2.0
# Bees farther away than this (metres from the camera) fade out and are not drawn.
#beeViewDistance=45.0

# Bats fly through the cave around you while you are underground: common pipistrelles, greater horseshoe bats and brown long-eared bats, alone or in small groups of up to four, fluttering and swooping after insects. They come looking around you and dart away once you get close. They keep well clear of the rock, water, items, creatures and you, never fly out of the cave mouth, and only appear where there is room - more of them at night and in big chambers, fewer in winter, none in the tightest mine tunnels. Torches and lamps light them. Needs the deferred renderer.
#useBats=true
# Most bats around you at once (in a big open chamber at night).
#batCount=18
# Size of the bats (1 = natural size: 22-36 cm wingspan).
#batScale=1.0
# Far-away bats are drawn at least this many pixels across (up to 2.5x their size).
#batMinPixels=3.0
# Bats farther away than this (metres from the camera) fade out and are not drawn.
#batViewDistance=32.0

# Spawns extra fish schools near the player, checked to make sure they're actually over water.
#useMoreFish=true
# Per-tick chance of a new fish spawning.
#fishSpawnChance=0.15
# Radius around the player fish spawn within.
#fishRadius=14.0
# Fish become real 3D animals instead of flat pictures: perch, roach, trout and carp with fins, scales that glint, eyes and a swimming body wave. They school together, stay in the water, keep away from the shore and dart off when you come close. Needs the deferred renderer, otherwise the old sprites stay.
#use3DFish=true
# Size of the 3D fish (1 = natural size; a little bigger reads better through the water).
#fishScale=1.25
# Most fish alive around you at once.
#fishMaxCount=120
# How long a fish stays around, in seconds (each one varies a bit), before it swims off and fades.
#fishLifetime=75.0
# Fish farther away than this (metres from the camera) fade out smoothly and are not drawn. Fish that drift past it swim off, and new ones appear close to you.
#fishViewDistance=24.0

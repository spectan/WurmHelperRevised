# Settings for the uiscale module merged into WurmHelper (originally mods/uiscale.properties)
# UI Scale for Wurm Unlimited - settings.
# Restart the game after changing them.


# How much larger the interface is drawn, 1.0 to 4.0.
#   1.3   1920x1080 lays out like 1477x831
#   1.5   1920x1080 lays out like 1280x720
#   2     3840x2160 lays out like 1920x1080 (4K)
scale=1.5

# How far the chat and event windows fade when nothing happens in them,
# 0.05 to 1. 0.3 is 30% opacity; 1 means never fade.
fade=0.3

# Seconds without activity before they fade.
fadeAfter=15

# How far the target window fades while nothing is targeted, 0 to 1.
# 0 hides it completely, and clicks pass through where it was; 1 means never
# fade. It comes back as soon as you target something (above 0, also when
# you move the mouse over it).
targetFade=0

# How far the fight window (stances and attack directions) fades while you
# are not fighting, 0 to 1. 1 means never fade. It comes back as soon as a
# fight starts or you move the mouse over it.
combatFade=0.3

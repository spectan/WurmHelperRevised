classname=net.ildar.wurm.WurmHelper
classpath=WurmHelper.jar
sharedClassLoader=true

# Hide the periodic "Ildar blesses you!" message
#NoBlessings=false

# Colour of the mod's console messages, as r,g,b between 0 and 1
#ConsoleMsgColor=0.5,1.0,1.0

# Also show bot state changes (on/off, paused, toggles) on screen, not only in the console
#OnscreenFeedback=true

# Play an alarm sound when a bot stops by itself (an error, a missing tool...)
#AlarmOnStop=false

# Put the last bot command back into the console input line after running it.
# Turn off if you drive bots from keybinds and don't want the input line rewritten
#PrefillConsoleInput=true

# Merged mods. Each is on unless switched off here, e.g. module.esp=false
# Their own settings go in mods/WurmHelper/<id>.properties (e.g. mods/WurmHelper/uiscale.properties).
# A mod that is still installed separately (its mods/<name>.properties exists) is skipped -
# remove the separate copy to use the built-in one. Type "modules" in the console to see their state.
#module.uiscale=true
#module.archeogroup=true
#module.compass=true
#module.esp=true
#module.ezbulk=true
#module.fishbuddy=true
#module.freecam=true
#module.improvedimprove=true
#module.livemap=true
#module.skilltrack=true
#module.timelock=true
#module.toolbelt=true
#module.tooltips=true

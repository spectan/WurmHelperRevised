# Settings for the ezbulk module merged into WurmHelper (originally mods/ezbulk.properties)
# EZBulk
# Hold SHIFT while dragging a commodity from one bulk container to another
# to move every QL group of that item, not just the one you grabbed.
# CTRL+drag moves only the stack you grabbed.
# /ezbulk_reload updates the game according to the .properties file
# /ezbulk_debug toggles the log file (EZBulk_Log.txt).

# When off (default): all logs / all wood scrap / all sprouts move together.
# When on: match by wood type like ore (only "log, firwood", only that scrap, only that sprout).
selective_wood=off
selective_wood_scrap=off
selective_sprout=off
all_meat=on

# If your server changed item numbers, you can add or remove different types of bulk containers.
# Items with IDs on this list will be treated as containers rather than movable commodities.
container_types=469,311,312,661,662,851,852,670,1119,1120,1277,1278,1279,1311,1312,1315,1316,1317
